/**:
  ros__parameters:
    # Rate at which the /diagnostics topic is published.
    publish_rate: 1.0  # Hz

    # Default freshness thresholds (applied to IMU, LiDAR, Odometry, Hardware Bridge).
    # A sensor silent for longer than freshness_warn_sec produces a WARN status.
    # A sensor silent for longer than freshness_error_sec produces an ERROR status.
    freshness_warn_sec: 5.0    # seconds
    freshness_error_sec: 10.0  # seconds

    # Battery thresholds (derived from 4S LiPo voltage range 12.0–16.8 V).
    battery_warn_pct: 20.0   # %  — below this → WARN
    battery_error_pct: 10.0  # %  — below this → ERROR

    # ESC / motor temperature thresholds.
    motor_temp_warn_c: 60.0   # °C — above this → WARN
    motor_temp_error_c: 80.0  # °C — above this → ERROR

    # Path-tracking error thresholds, applied to the MAXIMUM |lateral error|
    # seen during the FollowPath goal that is currently running.
    # Reference points: FTC tracks coverage paths to 8-16 mm, and adjacent F2C
    # swaths deliberately overlap by `swath_overlap` (0.02 m) — so a sustained
    # lateral error above ~0.10 m is already leaving an uncut band, while 0.25 m
    # is half a swath off and means the controller is not tracking at all.
    path_tracking_warn_m: 0.10   # m — above this → WARN
    path_tracking_error_m: 0.25  # m — above this → ERROR
    # Silence longer than this means no FollowPath goal is running (parked,
    # docked, planning). Reported as OK with the previous goal's summary — a
    # docked robot is not a fault.
    path_tracking_idle_sec: 2.0  # seconds
