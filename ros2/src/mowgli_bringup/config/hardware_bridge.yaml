hardware_bridge:
  ros__parameters:
    serial_port: "/dev/mowgli"
    baud_rate: 115200
    heartbeat_rate: 4.0   # Hz – keep-alive messages sent to firmware
    # Serial-link RX watchdog: reopen the port if no STM32 bytes arrive for this
    # long (auto-reconnect after a firmware flash / board reboot / USB
    # re-enumeration, which otherwise leaves the bridge writing to a dead fd).
    serial_rx_timeout_s: 2.0
    publish_rate: 100.0   # Hz – sensor read tick. Actual /imu/data rate
                          # is capped by the firmware packet rate (~47 Hz);
                          # 100 Hz tick ensures every available packet is
                          # consumed promptly without serial backlog.

    # IMU boot-time / re-dock calibration sample count.
    # Firmware publishes gyro+accel at ~48 Hz, so 1000 samples is ~20 s of
    # collection. Raised from the hardware_bridge default (200 → ~4 s) because
    # 4 s of MEMS integration sits in the noisy end of the Allan-variance
    # curve — the residual bias stays elevated. 20 s puts us past the Allan
    # minimum for the WT901, giving ~√5 ≈ 2.2× tighter gyro/accel offsets.
    imu_cal_samples: 1000

    # 2026-07-17 Option C (task #34): the host-side closed-loop angular-rate
    # (yaw) controller that used to be configured here (Option B, task #24 —
    # angular_rate_ki/_kff/_kp/_loop_enabled) is REMOVED. The yaw-rate loop
    # now runs in firmware (task #33), closing on the same gyro without the
    # host's USB round-trip latency; tune it via yaw_kp/yaw_ki (SET_DRIVE_PID)
    # instead.

    # ── Wheel-slip dig detection (smart avoidance) ────────────────────────
    # Catches the robot DIGGING: wheels turning freely while the chassis
    # stays put, carving a hole in the lawn. Every other stuck-check on this
    # robot measures the wheels (firmware ANTIDIG_* compares encoder ticks;
    # FTC's stall cap reads /wheel_odom; fusion_graph's slip veto is
    # rotational only), so all of them are confirmed by the very encoders
    # that are lying. This one compares encoder-claimed travel against the
    # GNSS-anchored fused pose (/odometry/filtered_map) — the only
    # wheel-independent signal available — and on a mismatch hard-stops and
    # reverses out. It runs in the bridge so it covers EVERY motion lane
    # (coverage, transit, docking, teleop), which all merge onto ~/cmd_vel.
    #
    # The firmware anti-dig is unchanged and remains the un-bypassable
    # backstop for BLOCKED wheels — the complementary case this cannot see.
    dig_detect_enabled: true
    dig_window_s: 1.2          # sustained evidence before latching [s]. This
                               # plus one monitor tick is the detection FLOOR
                               # (~1.3 s, ~0.6 m of tyre at the observed
                               # 0.47 m/s spin). It is the false-fire guard and
                               # is deliberately not shortened — nothing in the
                               # field logs justifies a shorter one.
    dig_min_cmd_speed: 0.05    # below this we aren't commanding travel [m/s]
    dig_min_wheel_dist: 0.15   # the WORST WHEEL must claim this much ground
                               # travel first [m] (without it a BLOCKED wheel —
                               # the firmware's case, not ours — looks
                               # identical). Measured on max(|dL|,|dR|), NOT on
                               # the chassis-centre distance: these digs are
                               # asymmetric (issue #499 — a turn radius below
                               # the half-track reverses the inner wheel), and
                               # over the 2026-08-24 mow3 log the centre
                               # measure retained only 42 % of the grinding
                               # tyre's travel. In 13 of 33 field episodes that
                               # left the floor unreachable inside one window,
                               # so those digs could not latch at all. Against
                               # the worst wheel all 33 clear it (slowest
                               # 0.152 m/s -> 0.18 m per 1.2 s window).
    dig_progress_fraction: 0.35  # latch if map travel < 35 % of wheel travel.
                               # Map travel is NET DISPLACEMENT across the
                               # window, never a sum of per-tick |steps| — a
                               # sum is a path length that grows with estimator
                               # wander and with dig_monitor_rate. Measured at
                               # the five 2026-08-24 latches the summed value
                               # swung 0.00-0.07 m against a ~0.09 m threshold
                               # while the robot's true motion was 0.13 m in
                               # 18 s, so detection landed only in the windows
                               # where the wander happened to be quiet.
    # Above this fused-pose 1-sigma the detector STANDS DOWN: in RTK-Float the
    # map pose cannot tell slip from GNSS noise, and a false positive
    # hard-stops a healthy robot mid-mow.
    # Fed from the RECEIVER's horizontal accuracy under a confirmed RTK-Fixed
    # solution, NOT the factor graph's marginal. The graph value was tried and
    # does not work at any threshold: sampled over 90 s of live RTK-Fixed
    # mowing (2026-08-24) it had p50 0.574 m / max 1.391 m while the receiver
    # reported 0.014 m and FTC tracked to 8-16 mm. A 0.25 m gate blocked 57.6 %
    # of ticks and 0.40 m still blocked 56.4 %. Under RTK-Fixed the receiver
    # reports ~0.014 m, so 0.10 passes comfortably; under Float it reports
    # decimetres to metres and the detector stands down.
    dig_max_pos_sigma: 0.10
    dig_gnss_timeout_s: 2.0    # /gps/status older than this = stand down [s]
    # Above this MEASURED (gyro) yaw rate the robot is turning and the
    # wheel-vs-map comparison proves nothing — the encoders measure arc while
    # the map measures chord, and the graph's own estimate degrades through a
    # turn-around (sigma spikes to 1-3 m at every swath U-turn). Gyro, never
    # wheel-derived yaw: a one-wheel slip shows a huge WHEEL yaw rate with the
    # chassis stationary, so a wheel-based exclusion would suppress the very
    # dig this detector exists to catch. A U-turn at connector_turn_radius
    # 0.18 m and 0.2 m/s is ~1.1 rad/s; coverage straights sit near zero.
    dig_max_yaw_rate: 0.20
    dig_gyro_timeout_s: 0.5    # gyro older than this = stand down [s]
    dig_reverse_speed: 0.12    # escape reverse speed [m/s]
    dig_reverse_dist: 0.30     # escape distance budget [m]
    dig_reverse_timeout_s: 4.0  # hard time bound on the escape [s]
    dig_monitor_rate: 10.0     # Hz
    dig_pose_timeout_s: 1.0    # fused pose older than this = stand down [s]
