# Nav2 parameters — GPS-only / no-LiDAR overlay (merged onto
# nav2_params_base.yaml). Carries ONLY what differs from the LiDAR variant:
# static-map costmap layers (no /scan obstacle source) plus the fleet peers
# layer, a collision_monitor whose only source is the fleet peer cloud, and a
# longer planner costmap_update_timeout (slow costmaps without LiDAR ticks).
# Everything else lives in the base. Deep-merged in navigation.launch.py.
#
# OBSTACLES WITHOUT A LIDAR: the only thing a GPS-only robot can ever see is
# another fleet member (docs/MULTI_ROBOT.md § 3c — the GUI feeds the peers'
# footprints into /fleet/peer_obstacles). Until 2026-10-10 the no-LiDAR
# overlay kept every obstacle consumer OFF (no layer to read), so a peer in
# the costmap changed nothing and the two mowers only had the coordinator's
# stop rule between them, which stops ONE of them. The consumers are now ON,
# exactly as in the LiDAR variant: with an empty lawn they see nothing and
# behave as before; with a peer they stop short (RPP collision check,
# collision_monitor approach) or skirt it (FTC deviation).

controller_server:
  ros__parameters:
    FollowPath:
      primary_controller:
        use_collision_detection: true        # local costmap = fleet peers only

    # FollowCoveragePath is FTCController (from the base). The PID tracking is
    # identical to the LiDAR variant; the obstacle flags are ON so a peer
    # standing on the swath is skirted (lateral deviation) or stopped for,
    # exactly like a LiDAR obstacle — the local costmap's fleet_layer is the
    # only source, so on a lawn without peers this is a no-op.
    FollowCoveragePath:
      check_obstacles: true
      enable_obstacle_deviation: true

planner_server:
  ros__parameters:
    # See controller_server for rationale — costmap_update_timeout default
    # (1.0s) races with the slow costmap update rate when no LiDAR is
    # driving obstacle layer ticks, causing repeated planning failures.
    costmap_update_timeout: 5.0

global_costmap:
  global_costmap:
    ros__parameters:
      # ORDER IS LOAD-BEARING: inflation_layer BEFORE keepout_filter, so the
      # keepout mask (recorded boundary + drawn obstacles) is NOT inflated —
      # only the static_layer cells are. See the global_costmap block in
      # nav2_params_base.yaml; test_nav2_params.py pins this in both variants.
      # fleet_layer sits before inflation_layer so a peer's footprint IS inflated.
      plugins: ["fleet_layer", "inflation_layer", "keepout_filter"]

      # fleet_layer: the other fleet members' footprints as lethal cells
      # (docs/MULTI_ROBOT.md). Without a LiDAR nothing else on this robot can
      # see a peer, so BOTH costmaps carry it: Smac routes transit around a
      # peer and the local lane refuses to drive into one. A distinct layer
      # name on purpose: CI forbids obstacle_layer + static_layer in one
      # costmap. Marking only; the cloud is republished at 5 Hz, empty when the
      # robot is alone, so the source never goes stale. Keep the two copies
      # observation settings identical (test_nav2_params.py checks both).
      fleet_layer:
        plugin: "mowgli_nav2_plugins::RecentObstacleLayer"
        enabled: true
        observation_sources: fleet_peers
        fleet_peers:
          topic: /fleet/peer_obstacles
          data_type: "PointCloud2"
          marking: true
          clearing: false
          observation_persistence: 1.0
          min_obstacle_height: 0.0
          max_obstacle_height: 1.5
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
          raytrace_max_range: 0.0
          raytrace_min_range: 0.0


local_costmap:
  local_costmap:
    ros__parameters:
      plugins: ["static_layer", "fleet_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_topic: "/no_lidar_static_map"
        subscribe_to_updates: false
        transform_tolerance: 0.5

      # Second copy of the global fleet_layer above — keep them identical.
      fleet_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: fleet_peers
        fleet_peers:
          topic: /fleet/peer_obstacles
          data_type: "PointCloud2"
          marking: true
          clearing: false
          observation_persistence: 1.0
          min_obstacle_height: 0.0
          max_obstacle_height: 1.5
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
          raytrace_max_range: 0.0
          raytrace_min_range: 0.0


collision_monitor:
  ros__parameters:
    # No LiDAR: the ONLY thing this monitor can see is another fleet member,
    # through the fleet peer cloud (docs/MULTI_ROBOT.md § 3c). One velocity-
    # projected approach gate (same shape as the LiDAR variant's hard stop:
    # it keys on the commanded direction, so it never freezes a reverse
    # escape — issue #393); the static PolygonStop stays defined but OFF.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      # The peer footprint is DENSE (one point per 5 cm cell), so two points
      # inside the projection is already a real body, not a stray return.
      min_points: 2
      visualize: true
      polygon_pub_topic: "polygon_approach"
      enabled: true
    PolygonStop:
      type: "polygon"
      points: "[[0.50, 0.20], [0.50, -0.20], [-0.10, -0.20], [-0.10, 0.20]]"
      action_type: "stop"
      min_points: 2
      visualize: false
      polygon_pub_topic: "polygon_stop"
      enabled: false
    observation_sources: ["fleet_peers"]
    fleet_peers:
      type: "pointcloud"
      topic: /fleet/peer_obstacles
      min_height: 0.0
      max_height: 1.5
      enabled: true
      # 0.0 DISABLES the staleness stop for this source (nav2_collision_monitor
      # Source::sourceValid skips the check when the timeout is zero). The
      # base file's 1.5 s would otherwise halt every autonomous motion the
      # moment fleet_peer_obstacles.py is down — on a single-robot GPS-only
      # install that node is the only source, and a stop with nobody to avoid
      # is the wrong failure. Phantom-peer safety comes from the node itself:
      # it drops any peer pose older than 3 s and is respawned by the launch.
      source_timeout: 0.0
