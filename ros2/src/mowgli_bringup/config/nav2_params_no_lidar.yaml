# Nav2 parameters — GPS-only / no-LiDAR overlay (merged onto
# nav2_params_base.yaml). Carries ONLY what differs from the LiDAR variant:
# static-map costmap layers (no /scan obstacle source), a pass-through
# collision_monitor (scan disabled), FollowPath collision detection off, and
# a longer planner costmap_update_timeout (slow costmaps without LiDAR ticks).
# Everything else lives in the base. Deep-merged in navigation.launch.py.

controller_server:
  ros__parameters:
    FollowPath:
      primary_controller:
        use_collision_detection: false       # no obstacle_layer without LiDAR

    # FollowCoveragePath is FTCController (from the base). Without LiDAR there is
    # no local obstacle_layer to read, so FTC's costmap-based obstacle checking
    # and lateral path deviation must be OFF — otherwise it queries an empty/
    # static costmap. The PID path tracking is identical to the LiDAR variant;
    # only these two obstacle flags differ (mirrors FollowPath.use_collision_
    # detection above). collision_monitor + firmware remain the safety net.
    FollowCoveragePath:
      check_obstacles: false
      enable_obstacle_deviation: false

planner_server:
  ros__parameters:
    # See controller_server for rationale — costmap_update_timeout default
    # (1.0s) races with the slow costmap update rate when no LiDAR is
    # driving obstacle layer ticks, causing repeated planning failures.
    costmap_update_timeout: 5.0

global_costmap:
  global_costmap:
    ros__parameters:
      plugins: ["static_layer", "fleet_layer", "keepout_filter", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_topic: "/no_lidar_static_map"
        subscribe_to_updates: false
        transform_tolerance: 0.5

      # fleet_layer: the other fleet members' footprints as lethal cells
      # (docs/MULTI_ROBOT.md). Without a LiDAR nothing else on this robot can
      # see a peer, so BOTH costmaps carry it: Smac routes transit around a
      # peer and the local lane refuses to drive into one. (The LiDAR variant
      # keeps the source on the LOCAL obstacle_layer only because FTC's zone
      # mask treats global-lethal cells as non-obstacles; FTC's obstacle flags
      # are pinned off in this variant so that mask is moot here.) A distinct
      # layer name on purpose: CI forbids obstacle_layer + static_layer in one
      # costmap. Marking only; the cloud is republished at 5 Hz, empty when the
      # robot is alone, so the source never goes stale. Keep the two copies
      # identical (test_nav2_params.py checks both).
      fleet_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: fleet_peers
        fleet_peers:
          topic: /fleet/peer_obstacles
          data_type: "PointCloud2"
          marking: true
          clearing: false
          observation_persistence: 1.0
          min_obstacle_height: 0.0
          max_obstacle_height: 1.5
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
          raytrace_max_range: 0.0
          raytrace_min_range: 0.0


local_costmap:
  local_costmap:
    ros__parameters:
      plugins: ["static_layer", "fleet_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_topic: "/no_lidar_static_map"
        subscribe_to_updates: false
        transform_tolerance: 0.5

      # fleet_layer: the other fleet members' footprints as lethal cells
      # (docs/MULTI_ROBOT.md). Without a LiDAR nothing else on this robot can
      # see a peer, so BOTH costmaps carry it: Smac routes transit around a
      # peer and the local lane refuses to drive into one. (The LiDAR variant
      # keeps the source on the LOCAL obstacle_layer only because FTC's zone
      # mask treats global-lethal cells as non-obstacles; FTC's obstacle flags
      # are pinned off in this variant so that mask is moot here.) A distinct
      # layer name on purpose: CI forbids obstacle_layer + static_layer in one
      # costmap. Marking only; the cloud is republished at 5 Hz, empty when the
      # robot is alone, so the source never goes stale. Keep the two copies
      # identical (test_nav2_params.py checks both).
      fleet_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: fleet_peers
        fleet_peers:
          topic: /fleet/peer_obstacles
          data_type: "PointCloud2"
          marking: true
          clearing: false
          observation_persistence: 1.0
          min_obstacle_height: 0.0
          max_obstacle_height: 1.5
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
          raytrace_max_range: 0.0
          raytrace_min_range: 0.0


collision_monitor:
  ros__parameters:
    polygons: ["PolygonStop", "FootprintApproach"]
    PolygonStop:
      type: "polygon"
      points: "[[0.50, 0.20], [0.50, -0.20], [-0.10, -0.20], [-0.10, 0.20]]"
      action_type: "stop"
      min_points: 2
      visualize: false
      polygon_pub_topic: "polygon_stop"
      enabled: false
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 2.0
      simulation_time_step: 0.05
      min_points: 1
      visualize: false
      enabled: false
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: /scan
      enabled: false
