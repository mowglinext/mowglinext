# =============================================================================
# mowgli_robot.yaml — Centralized robot-specific configuration
#
# All physical, operational, and safety parameters for the Mowgli robot mower.
# Inspired by OpenMower's mower_config.sh but in ROS2 YAML format.
#
# This file is the single source of truth for robot-specific values.
# Other config files (nav2_params, coverage_planner, etc.) should reference
# or be overridden by these values at launch time.
# =============================================================================

mowgli:
  ros__parameters:

    # -----------------------------------------------------------------
    # Hardware / Physical
    # -----------------------------------------------------------------
    mower_model: "YardForce500"

    # Chassis dimensions (metres) — physically measured on the actual
    # YardForce 500. Earlier the runtime YAML had 0.54 m which silently
    # diverged from this template; the 0.60 m here is the correct value
    # and was restored on 2026-04-26.
    chassis_length: 0.60
    #
    # chassis_width — 0.45 m, confirmed by the maintainer on the physical
    # YardForce 500 (2026-09-05). This replaces a long-standing 0.40 whose
    # comment claimed it too was "physically measured"; that claim could not be
    # traced to any measurement record, and the one machine anybody has put a
    # tape on reads 0.45. A site whose chassis differs MUST override this in its
    # installed mowgli_robot.yaml (Invariant 15).
    #
    # What rides on this key, so the cost of getting it wrong is explicit:
    #   * Nav2/URDF footprint half-width — mowgli.launch.py:128 (fp_half_w =
    #     chassis_width/2, no margin) and navigation.launch.py:311 (fp_hw =
    #     chassis_width/2 + 0.05 costmap margin).
    #   * map_server.chassis_width (full_system.launch.py:389) and
    #     map_server.bypass_safety_margin = chassis_width/2
    #     (full_system.launch.py:398) — the mow-progress bypass corridor.
    #   * coverage_server.robot_width (navigation.launch.py:930) — F2C
    #     Robot::getWidth(), used by the connector footprint check.
    #   * The URDF chassis box, hence every sensor's lateral placement.
    #   * FTC's obstacle_body_half_width (nav2_params_base.yaml) is a HARDCODED
    #     0.12 and is NOT injected from here, so it does not follow this key.
    #   * The obstacle_inflation_radius clamp floor in navigation.launch.py is
    #     derived from the circumscribed radius of the footprint above. With
    #     chassis_length 0.60 and chassis_center_x 0.18 the footprint is
    #     x[-0.170, 0.530] y±(w/2 + 0.05), so that radius is
    #     sqrt(0.530² + 0.275²) ≈ 0.597 m at this width (it was ≈ 0.586 m at
    #     0.40 — i.e. the shipped floor of 0.58 was ALREADY marginally under
    #     the radius before this change). The floor is raised to 0.60 with it.
    chassis_width: 0.45
    chassis_height: 0.19
    chassis_mass_kg: 8.76

    # Drive wheels (rear)
    # wheel_radius — 0.1 m, per the maintainer's physical measurement on the
    # YardForce 500 ("the wheels are 10 cm radius", 2026-09-05).
    # It replaces a template default of 0.04475 m — an 8.95 cm DIAMETER drive
    # wheel — which disagreed 2× with mowgli.urdf.xacro's OWN default of 0.093
    # for the same wheel. One of those two was necessarily wrong and neither
    # traced to a measurement. The 0.093 scale is the one corroborated
    # elsewhere: the three Webots surfaces (config_webots/ros2_control.yaml,
    # urdf_webots/mowgli_webots.urdf, protos/MowgliMower.proto) all
    # independently carry 0.093 and cite "physical wheel radius from
    # mowgli_robot.yaml" — a value this file has never actually held. Only the
    # yaml template and the GUI model presets carried 0.04475.
    # The xacro default and mowgli.launch.py's fallback are now 0.1 too, so
    # there is ONE number instead of three. (The Webots surfaces keep 0.093:
    # changing them re-tunes sim wheel kinematics and is a separate job.)
    # SCOPE: wheel_radius is consumed ONLY by mowgli.urdf.xacro
    # (mowgli.launch.py:102 → xacro arg). It sets base_z_offset — base_link's
    # height above ground, which every sensor z (lidar_z, imu_z, gps_z) is
    # measured from — plus the wheel visuals/collisions and the ground-clearance
    # construction (the chassis box bottom sits exactly at base_link height, so
    # a wrong radius also mis-states ground clearance). NOTHING computes
    # odometry from it (hardware_bridge uses ticks_per_meter), so a wrong value
    # does not corrupt distance; it SILENTLY OFFSETS EVERY SENSOR z in TF.
    wheel_radius: 0.1
    wheel_width: 0.04
    wheel_track: 0.325         # centre-to-centre (from OpenMower).
                               # Read by hardware_bridge_node and URDF.
                               # MUST match firmware physical assumption.
    wheel_x_offset: 0.0       # drive wheels at base_link (wheel axis centre)
    chassis_center_x: 0.18    # chassis geometric centre forward of wheel axis (m)
                               # with chassis_length 0.60 → rear bumper -0.12,
                               # front bumper +0.48
    # ticks_per_meter is the runtime encoder scale consumed by
    # hardware_bridge_node and pushed down to the STM32 firmware after the
    # host connects. board.h TICKS_PER_M remains only the brief power-on
    # fallback before ROS re-applies the saved runtime value.
    ticks_per_meter: 399.0
    # Runtime max wheel-speed cap [m/s], consumed by hardware_bridge_node and
    # pushed to the STM32 (PACKET_ID_LL_SET_KINEMATICS) with wheel_track as the
    # wheel base, so both can be retuned without reflashing. The firmware clamps
    # this to at most its compiled MAX_MPS (board.h/template) — the wire can only
    # LOWER the cap, never raise it above the compiled safety ceiling.
    max_mps: 0.5
    # Runtime SAFETY limits pushed to the STM32 (PACKET_ID_LL_SET_SAFETY_LIMITS)
    # so the charge ceiling + e-stop timeouts can be TIGHTENED without reflashing.
    # Defaults mirror the firmware compile-time board_defaults.h values. The
    # firmware clamps every field so the wire can only make protection STRONGER:
    # charge V/I clamped <= compiled ceiling; the four trip timeouts clamped
    # <= compiled (faster e-stop); play_button_clear clamped >= compiled (harder
    # to un-latch the emergency). An unconnected host runs the compiled defaults.
    max_charge_voltage: 29.4          # [V] charge voltage ceiling
    max_charge_current: 1.2           # [A] charge current ceiling
    one_wheel_lift_emergency_ms: 2000 # [ms] one-wheel-lift trip
    both_wheels_lift_emergency_ms: 1000 # [ms] both-wheels-lift trip
    tilt_emergency_ms: 500            # [ms] tilt trip (mechanical + accelerometer)
    stop_button_emergency_ms: 100     # [ms] stop-button trip
    play_button_clear_emergency_ms: 2000 # [ms] hold-PLAY-to-clear-emergency
    # Drive-motor wheel-velocity PID + feedforward (consumed by
    # hardware_bridge_node, pushed to the STM32 firmware over the serial link so
    # the GUI can retune the per-wheel loop without reflashing). These are the
    # pre-calibration field defaults (surfaced in the GUI as "PID de vitesse des
    # roues" / "Anticipation"); a per-robot auto-tune result overrides them in the
    # sparse installed config. The firmware re-validates and clamps every value on
    # receipt (kp 0-200, ki 0-20000, kd 0-500, integral_limit 0-255,
    # pwm_per_mps 50-600).
    wheel_pid_kp: 0.2            # proportional gain [PWM per m/s]
    wheel_pid_ki: 0.092         # integral gain [PWM per (m/s·s)]
    wheel_pid_kd: 0.01          # derivative gain [PWM per (m/s²)] (0 = off)
    wheel_pid_integral_limit: 15.0   # anti-windup clamp on the integral term [PWM]
    wheel_pid_pwm_per_mps: 282.135   # open-loop feedforward velocity→PWM scale
    # Firmware gyro yaw-rate loop (Option C, 2026-07-17, task #33/#34 —
    # replaces the removed host-side angular_rate_* PI). Consumed by
    # hardware_bridge_node, pushed to the STM32 over PACKET_ID_LL_SET_YAW_PID
    # (a separate packet from SET_DRIVE_PID). Defaults are the firmware's own
    # power-on fallback (Firmware-2's #33 report). The firmware re-validates
    # and clamps every value on receipt (yaw_kp 0-5, yaw_ki 0-20,
    # yaw_trim_limit_mps 0-MAX_MPS=0.5).
    yaw_kp: 0.12                  # P gain [m/s differential trim per rad/s yaw error]
    yaw_ki: 0.40                  # I gain [m/s trim per (rad/s·s)]
    yaw_trim_limit_mps: 0.15      # clamp on |differential trim| [m/s]
    yaw_loop_enabled: true        # 1 = closed yaw loop on, 0 = open-diff passthrough
    # gyro_sign (+1/-1): sign of the onboard gyro's Z axis vs robot +yaw (CCW).
    # UNVALIDATED default (+1) — the field sign-check remedy if the loop
    # diverges is to flip this without a firmware reflash.
    yaw_gyro_sign: 1
    # Behavior tree tuning (consumed by behavior_tree_node)
    tick_rate: 10.0

    # -----------------------------------------------------------------
    # Area recording (RecordArea — "drive the boundary" teach-in)
    # -----------------------------------------------------------------
    # Both of these were HARDCODED in main_tree.xml until 2026-08-25. A field
    # recording came back with 24 vertices for a 38.13 m perimeter (~1.6 m
    # between vertices on a hand-driven garden boundary), because BOTH limiters
    # were set far coarser than the job needs. RecordArea also applies a fixed
    # 0.05 m minimum spacing between consecutive kept points; that gate is the
    # INTENDED resolution floor, and these two values exist to let it bind.
    #
    # area_simplification_tolerance: Douglas-Peucker tolerance in metres. DP
    # guarantees only that the stored polygon stays WITHIN this distance of the
    # driven path, so this IS the worst-case boundary error. It was 0.2 m —
    # larger than tool_width (0.18 m), i.e. the saved boundary could be off by
    # more than a full cutting swath. The useful window is [0.05, tool_width):
    # below 0.05 m there is nothing to gain (the sampler never produces points
    # closer than that, so a finer tolerance only preserves GNSS/steering
    # jitter as extra vertices), and at/above tool_width the error costs a whole
    # outermost pass. 0.05 m is both ends of that window's sweet spot:
    # tool_width / 3, and exactly as fine as the sampled data supports.
    area_simplification_tolerance: 0.05
    #
    # area_record_rate_hz: position sampling frequency. It was 2.0, which at any
    # real driving speed put samples 0.15-0.25 m apart — so the 0.05 m gate
    # almost never fired and the SAMPLE RATE, not the gate, was the real
    # limiter. The gate binds when speed / rate <= 0.05; max_mps (0.5 m/s) is a
    # hard runtime wheel-speed ceiling pushed to the STM32, so the robot cannot
    # be driven faster than that while recording, giving 0.5 / 0.05 = 10 Hz.
    # 10 Hz is ALSO the ceiling: RecordArea samples inside the BT tick, so
    # tick_rate (above) caps it — a larger value here is silently ineffective
    # and logs a warning at recording start. Raise tick_rate first if you ever
    # want to sample faster. The per-tick cost is one TF lookup plus a distance
    # compare; the trajectory preview republishes on its own 2 Hz clock so the
    # GUI path message does not get rebuilt at the sampling rate.
    area_record_rate_hz: 10.0
    # Localization-quality gate (LocalizationGuard): pause blade-on mowing
    # while ABSOLUTE POSITION is untrustworthy. Field incident 2026-08-02:
    # >60 s plain-GPS fallback (σ ≈ 1.5 m) drove the robot out of the area
    # before BoundaryGuard could see it.
    #
    # The signal is GNSS solution quality from /gps/status, NOT the fused
    # marginal covariance. fusion_graph deliberately releases the X constraint
    # during pivots (pivot_wheel_sigma_x = 0.5 m/node) and slip (adaptive
    # noise gain 10), so its σ_xy reaches >1.8 m while the receiver holds
    # RTK-Fixed at 1.4 cm. The old σ-keyed gate at 0.15/0.08 m was therefore
    # only satisfiable while PARKED (σ ≈ 0.05 m) and re-tripped on FTC's
    # PRE_ROTATE at every strip start — field 2026-08-20: ten degrade/recover
    # cycles in eight minutes with FollowStrip pinned at 0 %, a livelock.
    # See mowgli_behavior/localization_health.hpp for the full derivation.
    #
    # Pause above this receiver-reported horizontal accuracy, resume below the
    # tighter one. Defaults sit far above RTK-Fixed (~0.015 m) and ordinary
    # RTK-Float, but well under the ~1.5 m plain-GPS fallback being caught.
    loc_gnss_acc_pause_m: 0.30
    loc_gnss_acc_resume_m: 0.15
    # /gps/status older than this counts as a dead GNSS feed [s].
    loc_gnss_stale_s: 5.0
    # Persistence debounce: the condition must hold this long before the guard
    # flips, so per-epoch RTK fix flicker does not chatter it.
    loc_sigma_pause_persist_s: 3.0
    loc_sigma_resume_persist_s: 2.0
    # Divergence backstop on the fused σ_xy — the one hazard /gps/status
    # cannot see: the localizer rejecting every fix while the receiver stays
    # healthy (the reverted GnssMobileGate runaway, σ ≈ 2.5 m). MUST stay
    # above fusion_graph's own inflation ceiling (~2.35 m worst case) or the
    # 2026-08-20 livelock comes straight back. 0 disables the backstop.
    loc_sigma_pause_m: 5.0
    loc_sigma_resume_m: 2.0
    loc_sigma_backstop_persist_s: 10.0
    bt_debug_logging: false
    # idle_nav2_suspend (default false): when true, the BT PAUSEs the Nav2
    # lifecycle stack while parked on the dock so the costmaps stop looping and
    # idle CPU/thermal load drops sharply. Nav2 is RESUMEd (collision_monitor
    # back up) before any motion via the root Nav2ResumeGuard + Nav2ReadyPoll.
    # Opt-in per site.
    idle_nav2_suspend: false
    # IMU calibration (consumed by hardware_bridge_node — auto-triggered on dock)
    imu_cal_samples: 200
    imu_cal_persist_path: /ros2_ws/maps/imu_calibration.txt
    imu_cal_auto_rest_sec: 15.0
    imu_cal_periodic_recal_sec: 600.0
    # Magnetometer fusion (consumed by cog_to_imu_node + mag_yaw_publisher_node)
    enable_mag_cal: false
    mag_calibration_path: /ros2_ws/maps/mag_calibration.yaml
    declination_deg: 1.5
    min_horizontal_uT: 5.0
    mag_yaw_variance: 0.0027
    # Dock seeding (consumed by dock_yaw_to_set_pose)
    dock_pose_yaw_sigma_rad: 0.035
    # NOTE: ticks_per_revolution was REMOVED here on 2026-09-05. It had NO
    # consumer anywhere in ros2/ — it only ever appeared in this template, in a
    # derivation comment in mowgli_localization/config/wheel_odometry.yaml, and
    # in the GUI's drive-tuning REPORT (informational readback). Worse, its
    # value (84) was derived from the wrong wheel_radius (0.04475) and a
    # ticks_per_meter (300) that no calibrated robot runs, so it was a stale
    # cross-check that could only mislead. Encoder scale is ticks_per_meter,
    # which IS live and per-robot calibrated.

    # Front casters
    caster_radius: 0.03
    caster_track: 0.36

    # Mowing blade
    blade_radius: 0.09
    tool_width: 0.18           # effective cut width (2 × blade_radius)

    # -----------------------------------------------------------------
    # Lidar mount position / orientation (relative to base_link)
    #
    # These are TEMPLATE DEFAULTS for a back-to-front (~π yaw) LD19 sitting
    # roughly over the wheel axis. They are NOT a description of any particular
    # robot: the mount is per-build and MUST be set in the installed (sparse)
    # mowgli_robot.yaml whenever the real bracket differs (Invariant 15).
    # An earlier version of this comment claimed the block was "synced
    # 2026-04-26 to runtime config: this robot's LD19…" — it described a
    # machine that no longer exists, and at least one field robot now runs a
    # completely different mount (x ≈ 0.177, z ≈ 0.20, yaw ≈ −π/2). Measure
    # yours; do not trust these four numbers as as-built.
    #
    # lidar_yaw is also read by navigation.launch.py:303 for the scan
    # ground-filter projection, so a wrong sign there inverts the front/back
    # filter on a slope — it is not visual-only.
    # -----------------------------------------------------------------
    lidar_x: 0.0               # forward offset from wheel axis (m)
    lidar_y: 0.024             # lateral offset (m)
    lidar_z: 0.30              # vertical offset (m)
    lidar_yaw: 3.1408          # heading offset (rad) — ~π for 180°-rotated mount

    # IMU mounting (relative to base_link = wheel axis centre)
    # imu_y: −0.195 m — the IMU really does sit to the RIGHT of the wheelbase
    # on the YardForce 500 (maintainer-confirmed 2026-09-05, and what
    # gui/web/src/constants/mowerModels.ts has carried for every YardForce
    # preset all along). The template default used to be 0.0, which meant a GUI
    # "reset to default" (Invariant 15: reset = delete the key so it falls back
    # to THIS file) silently MOVED THE IMU 19.5 cm SIDEWAYS in the URDF — the
    # exact class of divergence the schema/template parity guard exists to
    # catch, and which it missed because it never compared the model presets.
    imu_x: 0.18                # forward offset from wheel axis (m)
    imu_y: -0.195              # lateral offset (m) — negative = right of centre
    imu_z: 0.095               # vertical offset (m) — base_height / 2
    imu_yaw: 0.0               # heading offset (rad) — if IMU is rotated

    # GPS antenna mounting (relative to base_link = wheel axis centre)
    # From OpenMower: OM_ANTENNA_OFFSET_X=0.3 (antenna on front top cover)
    gps_x: 0.3                 # forward offset from wheel axis (m)
    gps_y: 0.0                 # lateral offset (m)
    gps_z: 0.20                # vertical offset (m) — top of chassis + antenna

    # -----------------------------------------------------------------
    # Localization backend
    # -----------------------------------------------------------------
    # Map-frame localization is provided by fusion_graph_node (GTSAM
    # iSAM2 factor graph). It runs WITHOUT LiDAR when
    # use_scan_matching=false AND use_loop_closure=false — the graph
    # is just a Pose2 backbone with wheel between-factors, gyro
    # between-factors (or preintegrated factors when use_imu_preint=
    # true), and GNSS lever-arm + COG / mag unaries. Equivalent
    # functionality to the legacy ekf_map_node, with the option to
    # enable scan-matching + loop closure on LiDAR-equipped robots.

    # use_magnetometer (default false): subscribe to /imu/mag_yaw and
    # let it influence the map-frame yaw. The chassis motor field
    # induces a heading-dependent bias that no static cal can remove,
    # so this is OFF by default. Only flip to true on a motor-isolated
    # mag setup.
    use_magnetometer: false

    # use_scan_matching: per-tick ICP between the latest /scan and the
    # previous graph-node scan. Adds a BetweenFactor with rmse-scaled
    # covariance — bounded drift between consecutive nodes even when
    # GPS drops to RTK-Float. Required for "robot keeps mowing through
    # multi-minute GPS dropouts" scenarios. FORCED OFF when the LiDAR is
    # off (lidar_enabled/use_lidar false): navigation.launch.py ANDs this
    # flag with use_lidar before it reaches fusion_graph_node, so there is
    # no subscription and no factors. That AND is not cosmetic — this
    # template default is `true` and has no relation to lidar_enabled, so
    # without it a GPS-only robot ran fusion_graph with
    # use_scan_matching=True subscribed to a topic nothing published.
    use_scan_matching: true

    # use_loop_closure: on every new node, search earlier graph nodes
    # within ~5 m / >30 s ago for an ICP match against the current
    # scan. Accepted matches add a BetweenFactor that snaps the
    # trajectory back to consistency with previously-seen places.
    # Resets accumulated drift across multi-minute GPS-less stretches
    # and at session start when re-entering a previously-mapped area.
    # Cost: one ICP per candidate per tick (~5 ms each, capped to
    # lc_max_candidates=3). No-op when use_scan_matching is also
    # false; FORCED OFF when use_lidar=false (ANDed with use_lidar in
    # navigation.launch.py, same as use_scan_matching above) and on the
    # first boot, when no persisted graph exists to close against.
    use_loop_closure: true
    # use_lidar_map_anchor: scan-to-MAP localisation for RTK-Float. Under
    # fresh RTK-Fixed every scan is ray-cast into a georeferenced occupancy
    # grid at the trusted fused pose; once Fixed goes stale a particle filter
    # (Beluga) localises against that grid and its XY + covariance becomes a
    # unary factor. Heading stays with the gyro. Grid published latched on
    # /fusion_graph/lidar_map. ANDed with use_lidar like the two flags above.
    # OFF until the field A/B (Float while driving) validates it.
    use_lidar_map_anchor: false
    # lidar_anchor_shadow_mode: with the anchor enabled, ALSO run, score and
    # publish the particle filter under RTK-Fixed, never applying a factor —
    # /fusion_graph/lidar_anchor_candidate + diagnostics counters give the
    # anchor-vs-RTK comparison in the field. Costs one particle filter update
    # per 5 cm of travel. OFF by default.
    lidar_anchor_shadow_mode: false

    # -----------------------------------------------------------------
    # GPS / Positioning
    # -----------------------------------------------------------------
    gnss_receiver_family: "auto"
    gnss_serial_device: "/dev/ttyAMA4"
    gnss_serial_baud: 921600
    datum_lat: 0.000000000     # map origin latitude  (set per-site)
    datum_lon: 0.000000000     # map origin longitude (set per-site)
    gps_wait_after_undock_sec: 10.0   # wait for RTK fix after undocking
    gps_timeout_sec: 5.0              # pause mowing if no GPS for this long

    # NTRIP (RTK correction stream)
    ntrip_enabled: false
    ntrip_host: ""
    ntrip_port: 2101
    ntrip_user: ""
    ntrip_password: ""
    ntrip_mountpoint: ""

    # -----------------------------------------------------------------
    # Battery
    # -----------------------------------------------------------------
    battery_full_voltage: 28.0     # consider fully charged above this
    battery_empty_voltage: 24.0    # dock if below for sustained period
    battery_critical_voltage: 23.0 # immediate dock
    battery_full_percent: 95.0     # resume mowing above this %
    battery_low_percent: 20.0      # start docking
    battery_critical_percent: 10.0 # emergency dock
    battery_critical_recovery_percent: 30.0 # leave critical-battery state once charged above this %
                                            # (hysteresis upper bound; must be > battery_critical_percent)

    # -----------------------------------------------------------------
    # Mowing
    # -----------------------------------------------------------------
    # mowing_enabled: read by hardware_bridge_node, which gates blade ENABLE
    # requests at /hardware_bridge/mower_control — the merged chokepoint every
    # caller (BT SetMowerEnabled, FollowStrip, the GUI blade button) goes
    # through. false = DRY RUN: the robot mows the full path with the blade
    # never spinning. NOT a safety interlock — the STM32 firmware remains the
    # sole blade safety authority and a DISABLE always passes through
    # (mowgli_hardware/blade_gate.hpp). Read at startup: takes effect on the
    # next ROS2 container restart.
    mowing_enabled: true
    mowing_speed: 0.2              # m/s during coverage paths (field-validated comfortable cut speed)
    transit_speed: 0.2             # m/s during point-to-point navigation (→ RPP desired_linear_vel)
    # turn_speed_ratio: the coverage controller's speed THROUGH a bend, as a
    # fraction of mowing_speed. Injected at launch as
    # FollowCoveragePath.speed_slow = clamp(mowing_speed * turn_speed_ratio,
    # min_speed_mps, mowing_speed) — see navigation.launch.py.
    #
    # WHY IT EXISTS (issue #499): speed_slow used to be a STATIC 0.16 in
    # nav2_params_base.yaml while speed_fast tracked the operator's mowing_speed.
    # An operator who lowered mowing_speed to 0.15 therefore ended up driving the
    # swath-end TURNS 7 % FASTER than the straights — exactly backwards, and
    # exactly where the robot carves the lawn. Deriving it from mowing_speed
    # makes the speed slider apply to turns too, and (with a ratio <= 1) makes a
    # turn never faster than a straight.
    #
    # 0.8 reproduces the historical 0.16 / 0.20 pair, so this is a no-op for a
    # robot on the default mowing_speed. LOWER it to take heat out of swath-end
    # turns: wheel speeds in a bend scale linearly with it (v_outer =
    # v*(1 + track/2R)), so 0.6 removes ~25 % of the peak outer-wheel speed.
    # It does NOT change the inner/outer wheel RATIO — that is set by the turn
    # RADIUS against the half-track and is speed-independent (issue #499).
    # Clamped to (0, 1.0] at launch; the effective speed is additionally floored
    # at FollowCoveragePath.min_speed_mps, below which FTC's own floor would
    # override it anyway (and the wheels stall under the firmware deadband).
    turn_speed_ratio: 0.8
    # mow_angle_deg: swath direction. -1 (or any negative) = AUTO — the coverage
    # server picks the swath-count-minimising angle (F2C NSwath). 0..179 forces a
    # fixed swath angle in degrees. Flows to the BT (behavior_tree_node blackboard)
    # and into the plan_coverage action goal (PlanCoverageArea::buildGoal).
    mow_angle_deg: -1.0
    # NOTE: the former outline_passes / outline_overlap / outline_offset /
    # mow_angle_offset_deg / mow_angle_increment_deg knobs were REMOVED — no ros2
    # node read them (navigation.launch.py forwards only the keys below to
    # coverage_server, and the BT hardcodes mow_angle_deg=-1.0 "auto"). They were
    # dead controls. Use num_headland_passes / swath_overlap (below) instead.
    # headland_width — LIVE, but only in ONE branch. Read by
    # navigation.launch.py:582 and injected as
    # coverage_server.default_headland_width (:931), which planBoustrophedon
    # uses for exactly one thing (coverage_planning.cpp:810):
    #     n_rings = ceil(headland_width / operation_width), floored at 1
    # and ONLY when num_headland_passes == 0 (AUTO). With the shipped
    # num_headland_passes: 2 the ring count is FORCED and this key has no
    # effect; set num_headland_passes to 0 to hand the count back to it.
    # 0.18 / op_width 0.16 → ceil(1.125) = 2 rings, i.e. AUTO reproduces the
    # forced default.
    #
    # The previous comment here claimed this key was "currently INERT" because
    # "the coverage BT (PlanCoverageArea) derives the F2C headland from
    # chassis_width (ring_inset = 0.5*chassis_width + 0.05) and sends it in the
    # action goal". That is FALSE and was removed on 2026-09-05:
    # PlanCoverage.action has no headland field at all (goal = outer_boundary,
    # obstacles, mow_angle_deg), and `ring_inset` exists nowhere in the tree
    # except that stale comment. The server owns the headland; nothing
    # overrides it.
    headland_width: 0.18           # headland band (m); AUTO ring count only
    # num_headland_passes: 0 = auto (= ceil(headland_width / tool_width)).
    # >0 forces exactly that many concentric perimeter rings, e.g. 1 for a
    # single perimeter pass, 2 for double, regardless of headland_width.
    # -1 (or any negative) = NONE — no perimeter rings at all (#429). The
    # back-and-forth swaths become the outermost driven pass. Three distances,
    # easy to conflate — at the defaults below (chassis_safety_inset 0.20,
    # op_width = tool_width − swath_overlap = 0.16):
    #   * outermost swath CENTERLINE = chassis_safety_inset (0.20 m) inside the
    #     recorded boundary — exactly the line ring 0 would have driven, because
    #     F2C insets the outermost swath by op_width/2 the same way it insets
    #     ring 0 (swath_generator_base.cpp sx[0] = 0.5*cov_width).
    #   * uncut LATERAL band = 0.20 − 0.08 = ~0.12 m, the same band the rings
    #     leave. Sideways, NONE does not mow closer to the edge, nor further.
    #   * swath ENDS also land on that ~0.12 m line, because F2C clips each
    #     sweep line to the planning cell. With rings on the ends sit far deeper
    #     (the rings absorb that band), so at a ROW END the robot noses ~8 cm
    #     closer to the boundary than it ever does with rings on. That is the
    #     cost of having no apron, and it is head-on rather than parallel, where
    #     chassis_safety_inset's half-chassis-width reasoning does not apply.
    # Side effect: with no mowed apron beyond the swath ends, row-end U-turns
    # degrade to straight pivot-through corners instead of smooth arcs.
    # FIELD TEST OWED before trusting NONE on a real lawn (#429).
    # Read once at coverage_server startup — takes effect on the next ROS2 restart.
    num_headland_passes: 2         # 2026-07-23: field-validated default (was 0=auto)
    # mow_direction: perimeter/headland travel winding (issue #335). 0 = planner
    # default (F2C natural), 1 = clockwise, 2 = counter-clockwise. Set it so a
    # side-mounted blade stays on the cut side. navigation.launch.py injects this
    # into coverage_server.ring_direction; swaths/connectors follow the rings.
    mow_direction: 0
    # chassis_safety_inset: how far INSIDE the recorded boundary the OUTERMOST
    # headland ring's centerline sits. 0.0 (default) = the ring rides ON the
    # recorded line — the perimeter the operator drove — so the blade mows to the
    # edge and the chassis is allowed to STRADDLE the boundary. coverage_server
    # applies the op_width/2 outward expansion itself (generateHeadlandSwaths puts
    # ring 0 op_width/2 inside the planning field), so a value of 0 lands ring 0
    # exactly on the line. The safety stop is the LETHAL band the keepout mask
    # places OUTSIDE the line (0.40 m out, enforce_boundary_margin_m), not an
    # inward inset. Raise this to keep the chassis further inside (e.g.
    # chassis_width/2 = 0.20 to keep the WHOLE chassis inside, the old behaviour,
    # at the cost of a ~0.20 m uncut perimeter band). This keep-inside guarantee
    # now holds through TURNS as well: the turn-around connectors are clipped to
    # the outermost-ring centerline (recorded line minus this inset), so a U-turn
    # arc's chassis no longer bulges ~op_width/2 past the perimeter ring the way it
    # did before (that outward bulge grew with the turn radius). Read LIVE by
    # coverage_server (ros2-param-set-tunable).
    chassis_safety_inset: 0.2       # 2026-07-23: field-validated default (was 0.0) — keep whole chassis inside the boundary, un-wedges the outermost ring
    # NOTE: path_spacing was REMOVED here on 2026-09-05. It had already been
    # marked DEPRECATED in this file and hidden by the GUI
    # (useSettingsManager.ts:134); grep confirms no ROS2 node, no launch file
    # and no gui/pkg code ever read it. F2C swath spacing is
    # tool_width − swath_overlap (coverage_server.operation_width) and a second
    # spacing knob is exactly what re-opened the swath-gap bug. The key is kept
    # in the GUI JSON schema only so old installed YAMLs still validate; it is
    # allow-listed as template-less in schema_template_parity_test.go.
    # swath_overlap: F2C swath spacing = tool_width − swath_overlap, so adjacent
    # swaths overlap by this much. Covers the headland↔swath seam + BruteForce
    # edge margins (harness: 95 % → 100 % on the 9×6 m field). tool_width (the
    # map_server stamp radius) is unchanged. 0 = swaths exactly tool_width apart.
    swath_overlap: 0.02
    # min_turning_radius: hard floor on every forward turn-around / corner-fillet
    # arc in the CONTINUOUS coverage path (coverage_server → buildContinuousPath),
    # injected into coverage_server.min_turning_radius — so this is LIVE.
    # Two-sided: too small → the in-bounds shrink picks a loop tighter than MPPI
    # can track (wz≈vx/r), so the robot loops/hesitates at corners; too large →
    # the Ω-turn bulges OUTSIDE the polygon at the swath ends (R=0.35 left the
    # area by ~0.8 m, then got clipped into ragged turns). 0.15 m keeps every turn
    # fully in-bounds (harness: 0 cm bulge) and stays MPPI-trackable. A turn that
    # cannot be made in-bounds at >= this is left as a sharp pivot, never a
    # tighter loop. Keep within [0.10, 0.50].
    min_turning_radius: 0.15

    # -----------------------------------------------------------------
    # Docking
    # -----------------------------------------------------------------
    dock_pose_x: 0.0             # sim: robot at world origin; area is centred on origin instead
    dock_pose_y: 0.0
    # dock_pose_yaw MUST be a map-frame ENU yaw (rad) — opennav_docking
    # consumes it directly as the dock heading. Set it via the GUI
    # "Set Docking Point" button (robot seated on dock, charging,
    # RTK-Fixed, yaw converged) or the undock GPS-trajectory calibration;
    # both write the correct ENU value. A correctly-seated robot's
    # /odometry/filtered_map yaw equals this. NOTE: 4.17 below is a stale
    # hand-entered phone-compass seed (239°) — NOT a valid ENU yaw;
    # recalibrate per-site before relying on docking.
    dock_pose_yaw: 0.0             # sim: match MowgliMower world rotation (yaw 0, facing +X/east)
    undock_distance: 1.5           # reverse distance when undocking (m); must be > 0.5 m for CalibrateHeadingFromUndock
    # undock_speed — reverse speed (m/s) for the BackUp undock leg
    # (behavior_tree_node → main_tree.xml backup_speed) and for
    # calibrate_imu_yaw_node's dock reverse leg. The old justification, "above
    # kMinLinVel=0.15 host clamp", is DEAD: that hardcoded 0.15 host clamp was
    # removed — hardware_bridge_node.cpp:435 now floors |vx| at the RUNTIME
    # min_linear_vel parameter (default 0.05), as nav2_params_base.yaml:280
    # also records. 0.16 is therefore no longer forced from below.
    # Re-derived bounds:
    #   FLOOR  ~0.05-0.10 m/s — below min_linear_vel (0.05) the bridge zeroes
    #          the command outright, and near it the wheels sit in the firmware
    #          breakaway deadband (the same reason obstacle_reverse_speed_mps
    #          is 0.15 and start_blocked_escape_speed is 0.10).
    #   CEILING — this is a BLIND, open-loop reverse: no plan, no costmap
    #          lookahead behind the robot, and GPS is typically still Float
    #          under the dock canopy. undock_distance (1.5 m) is covered in
    #          ~9.4 s at 0.16 m/s, which is deliberately slower than
    #          mowing_speed (0.20) and matches RPP's near-dock
    #          min_approach_linear_velocity (0.16, nav2_params_base.yaml).
    # 0.16 is KEPT as the field-validated value inside those bounds; it may now
    # be lowered (the clamp no longer blocks it), but that is a supervised
    # physical-behaviour change, not a config tidy-up.
    undock_speed: 0.16             # reverse speed (m/s)
    # Distance (m) to the staging pose behind the dock — the final
    # straight-in approach runway. Injected as opennav_docking
    # simple_charging_dock.staging_x_offset = -dock_approach_distance
    # (navigation.launch.py). 1.5 m field-validated 2026-06 as a clean,
    # calm approach; longer runways (2.5) felt needlessly fast and bought
    # nothing once the dock pose is correctly pinned.
    dock_approach_distance: 1.5
    # Overshoot (m) applied to dock_pose in the body forward direction
    # when configuring opennav_docking's home_dock target. The robot
    # then aims at (dock_pose + overshoot) instead of dock_pose itself;
    # combined with docking_threshold (5 cm before the target), it
    # physically pushes past the calibrated pose so the charging
    # contacts seat firmly even when fusion's pose has 1-3 cm of
    # residual RTK / lever-arm noise. 5 cm matches docking_threshold
    # so a perfect-fusion robot stops exactly at the calibrated pose.
    dock_approach_overshoot: 0.05
    dock_max_retries: 3
    dock_use_charger_detection: true
    # Charging-current threshold (A) at which SimpleChargingDock considers
    # the cradle reached. 0.3 = solid contact past the spring detent on
    # the YardForce charger; lower stops short, higher over-presses.
    dock_charging_threshold: 0.3
    # Approach the dock off RTK-Fixed /gps/absolute_pose instead of the
    # fusion_graph map→odom TF. fusion_graph can reload CORRUPT after a
    # dock-arrival graph save (yaw flips, a metre-scale jump), which sends the
    # robot ~2 m off the cradle and times the docking action out. With this on,
    # gps_dock_detection_node publishes the true dock contact pose (GPS + the
    # calibrated dock_pose_*, expressed in the continuous odom frame — never via
    # map→odom) on /docking_server/detected_dock_pose, and opennav_docking's
    # SimpleChargingDock tracks THAT (use_external_detection_pose). Set false to
    # use the legacy graph-TF approach — e.g. at cradles where GPS only Floats
    # (the GPS detection requires RTK-Fixed; on Float it holds the last good
    # fix, and only the legacy path is GPS-independent).
    use_gps_dock_detection: true

    # -----------------------------------------------------------------
    # One-click dock calibration (dock_calibration_node / CalibrateDock action)
    # -----------------------------------------------------------------
    # Straight reverse leg off the dock (blade OFF, driven on /cmd_vel_docking
    # so collision_monitor stays in the loop). Distinct from undock_distance/
    # _speed: the calibration wants a longer, slower reverse for a tight COG
    # heading fit. 2.0 m @ 0.15 m/s is the maintainer-locked default.
    dock_calib_reverse_distance_m: 2.0
    dock_calib_reverse_speed_ms: 0.15
    # Extra forward travel (m) past the captured on-dock GPS point on the
    # re-dock leg, so the charging contacts seat before we declare success.
    dock_calib_redock_overshoot_m: 0.30
    # Timeouts (s): wait for RTK-Fixed before starting; wait for is_charging on
    # the forward re-dock before failing with NO_CHARGE_ON_REDOCK.
    dock_calib_rtk_wait_timeout_s: 10.0
    dock_calib_redock_charge_timeout_s: 30.0
    # COG-coherence gate over the reverse leg. The persisted dock_yaw is the
    # REVERSED RTK TRAVEL BEARING of the leg (~1° over 2 m); the circular mean
    # of the /imu/cog_heading BODY-heading samples is only cross-checked
    # against it. See dock_cog_gate.hpp. Fail (b)/(c) => COG_INCOHERENT =>
    # operator retries.
    dock_calib_cog_min_samples: 8                    # (a) min valid /imu/cog_heading samples
    # (b) circular-std ceiling. Per-sample COG scatter is set by the publisher's
    # 0.10 m baseline vs. RTK noise (2-3 cm σ => 10-19° per sample even on a
    # perfectly straight leg; field-measured 10-27° std across runs), so this
    # gate only screens gross RTK-Float wander. Heading quality is enforced by
    # (c) on the MEAN.
    dock_calib_cog_std_max_rad: 0.70
    # (c) COG-mean vs GPS-travel-bearing cross-check. Sanity only — the yaw
    # that gets persisted IS the reversed RTK travel bearing (~1° over a 2 m
    # leg); the COG mean has a 3-4° standard error, so a tight match gate
    # would trip on noise. ~20° still catches a dead/stale COG feed.
    dock_calib_cog_bearing_match_max_rad: 0.35
    dock_calib_min_baseline_displacement_m: 0.5      # (d) min reverse displacement for a fit

    # -----------------------------------------------------------------
    # Rain
    # -----------------------------------------------------------------
    # Modes: 0=ignore, 1=dock, 2=dock_until_dry, 3=pause_auto
    rain_mode: 2
    rain_delay_minutes: 30.0       # wait after rain stops before resuming
    rain_debounce_sec: 10.0        # rain must persist this long to trigger

    # -----------------------------------------------------------------
    # Safety
    # -----------------------------------------------------------------
    # NOTE: motor_temp_high_c / motor_temp_low_c were REMOVED — no node ever
    # read them and NO firmware thermal cutoff exists (adc.c only measures
    # blade_temperature and cpp_main.cpp only reports it, so the GUI's old
    # "Stop Above / Resume Below" card promised a cutoff that lives in no layer
    # of the stack). Temperature is a DIAGNOSTICS surface only: see
    # motor_temp_warn_c / motor_temp_error_c in
    # mowgli_monitoring/config/diagnostics.yaml (WARN/ERROR levels, no action).
    # Lift/tilt emergency is handled by firmware (STM32), not ROS2

    # -----------------------------------------------------------------
    # Start-pose escape (issue #487) — SAFETY-CRITICAL, PHYSICAL MOTION
    # -----------------------------------------------------------------
    # When every blade-off sub-path transit of a coverage pass is refused by
    # the Nav2 planner with START_OCCUPIED and nothing was mowed, the robot is
    # STANDING on a lethal/keepout cell and no plan exists from there. Clearing
    # the costmaps does not help — a keepout is a static costmap FILTER — so
    # the BT nudges the robot off the cell with a short, bounded, open-loop
    # move in the direction OPPOSITE the last motion it was commanded to make.
    # That one signal gets both field cases right: after an undock the robot
    # REVERSED into the spot, so the escape drives forward; mid-mow it arrived
    # driving forward, so the escape reverses onto known-good ground.
    #
    # The blade is switched off AND verified off first, and the command is
    # published on /cmd_vel_nav, so it passes through collision_monitor and the
    # LOWEST-priority twist_mux lane exactly like every other autonomous
    # motion. The STM32 remains the sole emergency-stop authority.
    #
    # If the direction is unknown, stale or ~zero, NOTHING is commanded and the
    # recovery falls back to clear-costmaps-and-retry, then retire + dock.
    # Set start_blocked_escape_enabled: false to keep that non-motion behaviour
    # permanently. See mowgli_behavior/start_blocked_escape.hpp.
    start_blocked_escape_enabled: true
    start_blocked_escape_speed: 0.10        # m/s — below mowing (0.20) and undock (0.16)
    start_blocked_escape_distance: 0.40     # m — distance budget (hard ceiling 0.60 in code)
    start_blocked_escape_timeout_s: 6.0     # s — hard time bound; ends the move even if the
                                            # wheels are not turning (0.40/0.10 = 4.0 s nominal)
    start_blocked_escape_min_signal_speed: 0.03   # m/s — below this a command is "not moving"
    # How old the direction signal may be (s). It must outlast a whole failed
    # coverage pass (the 2026-08-24 event burned 26 planning calls between the
    # undock and the recovery), or the escape always stands down and never
    # fires. Too SHORT is fail-safe (no motion, pre-#487 behaviour); too LONG
    # risks acting on a direction that no longer describes how the robot
    # arrived. Tune from a field log rather than by guesswork.
    start_blocked_escape_signal_max_age_s: 90.0

    # -----------------------------------------------------------------
    # Obstacles (GUI: Settings → Obstacles)
    # -----------------------------------------------------------------
    # How far the robot may deviate laterally from its path to skirt an
    # obstacle. ONE knob, TWO consumers (injected at launch):
    #   - FTCController max_lateral_deviation (coverage-time skirting)
    #   - map_server bypass_max_length (give-up threshold for the mow-progress
    #     bypass corridor)
    # Clamped to [0.5, 10.0] by navigation.launch.py.
    max_obstacle_avoidance_distance: 1.0   # 2026-07-23: field-validated default (was 3.0)
    # Inflation radius (m) around LiDAR-detected obstacles in the LOCAL
    # costmap — the buffer FTC/RPP keep from trunks, legs, walls seen by the
    # scan. Injected into local_costmap.inflation_layer.inflation_radius.
    # Clamped to [0.58, 1.50]: the nav2 inflation layer degrades
    # footprint-cost semantics below the chassis circumscribed radius
    # (~0.572 m), and FTC's deviation detector (cost threshold 253) assumes
    # the inscribed band exists. Raise this if the robot passes too close to
    # trees it can see. Does NOT affect the global costmap (its 0.20 m radius
    # is pinned — larger values blocked transit paths, see nav2_params_base).
    # 1.0 (was 0.80, was 0.60 before that) — task #35, 2026-07-17: field
    # analysis showed obstacles only pushing the path from 0.4-0.6 m out at
    # ~0.17 m/s, reacting too late for a smooth deviation; 0.80 was the
    # first bump. Task #43, same day: the user's own field-converged value
    # is 1.0, superseding #35's 0.80 — folded in as the new template default.
    # NAV2-TRANSIT ONLY (task #49, 2026-07-17): only MPPI/RPP's cost-based
    # potential field (point-to-point transit driving) reads the inflation
    # GRADIENT this radius controls. FTC (the coverage/mowing controller)
    # checks raw LETHAL cells only (obstacle_deviation.hpp kLethalThreshold),
    # never the inflated gradient — this knob has NO effect on how far out
    # the robot starts avoiding an obstacle WHILE MOWING. For that, see
    # obstacle_detection_range_m below.
    # 0.58 (was 1.0, 2026-07-23): a 1.0 m halo smeared a side obstacle's cost
    # across the whole front of a narrow (0.5-1.0 m) gap, so RPP transit saw
    # "collision ahead" and Nav2 backup/spin recoveries could not back out of a
    # physically-passable pocket (obstacle-wedge). Clamp-floored at 0.58 in
    # navigation.launch.py (chassis circumscribed radius ~0.572); this is the
    # smallest value the inflation layer supports without degrading footprint-
    # cost semantics. Values below 0.58 are raised to 0.58 at launch.
    obstacle_inflation_radius: 0.58
    # How far ahead along the coverage path (m) FTC scans for a lethal
    # obstacle cell before starting to skirt it — the real "avoid from
    # further out during mowing" knob (task #49; obstacle_inflation_radius
    # above does NOT affect this, see its comment). Injected into
    # FollowCoveragePath.obstacle_lookahead (nav2_params_base.yaml) as a
    # pose count: poses = round(this / kF2CSamplingM), kF2CSamplingM=0.05
    # (navigation.launch.py). 1.0 m = 20 poses, ≈5 s of warning at mowing_speed
    # 0.2 m/s. Clamped to [0.2, 5.0] m (>=4 poses so the detector always has a
    # usable lookahead window). 1.0 (was 1.5): FTC now models the true chassis
    # FOOTPRINT (use_footprint_clearance in nav2_params_base.yaml) rather than a
    # swept ±half_width line, so it reacts on the real body edge and needs less
    # forward warning to skirt smoothly.
    obstacle_detection_range_m: 2.0        # 2026-07-23: field-validated default (was 1.0) — earlier obstacle warning
    # How much SIDEWAYS room (m) FTC leaves beyond the chassis when it skirts a
    # detected obstacle. Raise this if the robot goes around obstacles but
    # shaves past them. With the footprint model, the chassis FOOTPRINT is
    # expanded LATERALLY by this margin for the clearance search ONLY — detection
    # reach (obstacle_detection_range_m above) is unaffected, which is why this
    # is a separate knob: widening the body instead would also widen detection
    # and re-open the "deviation > max -> hold 5 s" stalls. NOTE
    # obstacle_inflation_radius canNOT buy this margin — the footprint checks
    # threshold at cost 254 (TRUE lethal), above the inflation band entirely, so
    # raising inflation only grows the 1..253 region the check ignores. Clamped
    # [0.0, 0.50] (above ~0.5 the widened footprint trips the mowing-zone guard
    # on headland rings that hug the boundary, converting skirts into stalls).
    # 0.05 (was 0.10): the footprint already models the true body edge, so the
    # old margin — sized to cover the line model's centerline-miss gap — is now
    # double what's needed; halved to keep skirts tight while still clearing.
    obstacle_clearance_margin: 0.2         # 2026-07-23: field-validated default (was 0.05) — wider sideways room past obstacles
    # How long (s) FTC holds zero velocity on a blocked or over-max deviation
    # before aborting the strip and handing back to the BT. Debounces transient
    # LiDAR returns (a person crossing) so they don't burn a BT retry.
    # Clamped [0.5, 60.0].
    obstacle_wait_timeout_s: 2.5
    # Bounded reverse-escape (SAFETY-CRITICAL). When BOTH sides of an obstacle
    # are blocked — or the skirt needed exceeds max_lateral_deviation — FTC backs
    # STRAIGHT up (no rotation) a bounded distance and re-attempts the deviation
    # search from the new pose, BEFORE holding zero velocity and aborting the
    # strip. The rear chassis footprint is checked against TRUE-lethal cells
    # before every reverse tick; the maneuver fails safe (stops → wait/abort) on
    # any ambiguity (no footprint, rear obstacle, budget spent). This is a
    # distinct escape sub-state and does NOT relax the forward-only behaviour of
    # normal path following. OPT-IN — bounded reverse-escape drives the robot
    # BACKWARDS; enable only after a supervised field test (see PR notes). Fails
    # safe (wedged → hold/abort as before) when it cannot find a lethal-clear
    # rear corridor.
    # true (was false, 2026-07-23): a blade-on coverage wedge (FTC 'Failed to
    # make progress' beside an obstacle with both skirt sides blocked) has no
    # forward escape; the bounded rear-lethal-gated reverse is the only self-
    # recovery. SAFETY: still requires a supervised field test near the dock /
    # people — the maneuver is fail-safe by construction (0.30 m cap, rear
    # TRUE-lethal check every tick, stop on any ambiguity).
    obstacle_reverse_enabled: true
    # Hard cap on total reversed distance (m) per escape. Odom-integrated, never
    # exceeded. Clamped [0.0, 1.0] by navigation.launch.py.
    obstacle_reverse_max_dist_m: 0.30
    # Straight reverse speed (m/s). Must clear the firmware ~0.05 deadband to
    # move at all. Clamped [0.0, 0.30] by navigation.launch.py.
    obstacle_reverse_speed_mps: 0.15       # 2026-07-23: field-validated default (was 0.10) — clears firmware deadband to actually move
    # Extra margin (m) grown around DRAWN map obstacle polygons, applied in
    # BOTH the coverage planner (F2C holes are buffered outward before swath
    # planning) and the keepout mask (cells within the margin of an obstacle
    # polygon are LETHAL for transit planning). Use it to keep the robot off
    # root zones: draw the tree trunk as an obstacle and set the margin to
    # cover the roots (the 2D LiDAR cannot see them — they are below the
    # scan plane). Clamped to [0.0, 1.0].
    obstacle_margin: 0.2                    # 2026-07-23: field-validated default (was 0.15) — wider buffer around drawn obstacles
    # collision_monitor PolygonSlow slowdown factor when a scan return is
    # inside the chassis+15 cm approach box (LiDAR variant only). 0.3 = slow
    # to 30 % of commanded speed. Clamped to [0.05, 1.0].
    obstacle_slowdown_ratio: 0.7           # 2026-07-23: field-validated default (was 0.5)

    # -----------------------------------------------------------------
    # Navigation tolerances (garden terrain)
    # -----------------------------------------------------------------
    # History: 0.75/1.0 rad let FTC report SUCCESS with the chassis 25-40°
    # off the goal yaw, which made opennav_docking attack the cradle
    # "en biais" (sideways) — tightened to 0.30 m / 0.10 rad to force a
    # final in-place pivot before the dock approach.
    # Task #43, 2026-07-17: folded in the user's field-converged values,
    # tighter on position (0.10 m) but LOOSER on yaw (0.20 rad ≈ 11.4°)
    # than the 0.10 rad fix above. FLAGGED to team-lead/user: re-verify
    # docking approach heading is still square (not "en biais") with the
    # looser yaw tolerance — the #37/#39 firmware yaw-loop fixes (same
    # session) may be why 0.20 rad is now safe, but this reopens the exact
    # failure mode the 0.10 rad value was chosen to close.
    xy_goal_tolerance: 0.1         # metres — acceptable goal position error
    yaw_goal_tolerance: 0.1        # radians — acceptable heading error
    coverage_xy_tolerance: 0.50    # metres — must be >= FTC max_goal_distance_error (0.50): FTC parks that far short of the goal, so a tighter gate never completes the area (re-mow). Floored at FTC's value by navigation.launch.py.
    # Feeds controller_server progress_checker.movement_time_allowance (via
    # navigation.launch.py — it OVERWRITES the value in nav2_params_base.yaml).
    # How long the robot may fail to move required_movement_radius (0.15 m) on a
    # FollowCoveragePath strip before Nav2 aborts it (err 105 "Failed to make
    # progress"). On abort the coverage BT steps the resume cursor ~0.80 m past
    # the stall and skips that span, leaving an un-mowed band.
    # 2026-07-23 (#396): raised 10.0 → 30.0. At 10 s a transient localization
    # jump (RTK wrong-fix rejection flood + snap) coinciding with a
    # collision_monitor approach-slow near a boundary reliably stalled the strip
    # long enough to abort mid-swath, producing ~0.80 m un-mowed bands after an
    # otherwise-successful mow. The robot recovers from these jumps within
    # ~12-15 s; 30 s rides through them with margin while still catching a truly
    # stuck robot. Genuine wedges are handled by collision_monitor + FTC
    # obstacle-deviation + reverse-escape, not this timer, so the longer wait is
    # a coverage-completeness gain, not a safety regression.
    progress_timeout_sec: 30.0     # seconds without progress before a strip is aborted+skipped

    # -----------------------------------------------------------------
    # WS2812 status ring (mowgli_leds)
    # -----------------------------------------------------------------
    # Optional addressable LED ring driven from the SBC over SPI MOSI. Read-only
    # with respect to the robot; NOT part of the blade-safety path (the STM32
    # keeps its own status LED and remains the sole blade safety authority).
    #
    # OFF by default: an existing robot must not suddenly start writing to a
    # /dev/spidev it may not own. full_system.launch.py reads led_enabled here
    # for the led_ring_node launch gate, exactly as it does for lidar_enabled.
    #
    # On the Orange Pi 5B the ring's DATA line is on 40-pin header pin 19
    # (GPIO1_C1 = SPI4_MOSI_M0), and the SPI4-M0 device-tree overlay must be
    # enabled in U-Boot before /dev/spidev exists at all. See
    # ros2/src/mowgli_leds/README.md for the u-boot-update steps. Until then
    # the node warns ONCE and stands down; it never crashes or spams.
    led_enabled: false             # master switch; false = node is not launched
    led_count: 16                  # LEDs on the ring — SET THIS to the real count
    led_spi_device: "/dev/spidev4.1"  # confirm with `ls /dev/spidev*` after the overlay is live
    led_brightness: 0.6            # 0..1 linear scale on every channel. Whole-ring
                                   # white at 1.0 is ~60 mA per LED; 0.6 keeps a
                                   # 16-LED ring under ~0.6 A while staying readable
                                   # in daylight.
    led_refresh_hz: 20.0           # render tick. Frames are only WRITTEN when they
                                   # change (plus led_keepalive_s), so static modes
                                   # cost ~0.5 writes/s of 234 bytes.
    led_keepalive_s: 2.0           # re-send an unchanged frame at least this often
    led_status_timeout_s: 5.0      # no HighLevelStatus for this long -> STALE pattern
    led_device_retry_s: 30.0       # re-open a missing/failed /dev/spidev this often
    led_low_battery_percent: 20.0  # below this, and not charging, the ring blinks red
    led_charge_full_percent: 99.0  # at or above this a charging ring goes steady green
    led_idle_scale: 0.10           # brightness of the dim idle ring, relative to led_brightness
    led_spi_speed_hz: 2400000      # 3 SPI bits per WS2812 bit = 1.25 us. Do NOT retune
                                   # without re-reading ws2812_encoder.hpp — the symbol
                                   # table is derived from this exact clock.
