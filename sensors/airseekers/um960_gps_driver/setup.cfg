[flake8]
max-line-length = 100
# E203 is whitespace before ':' (black's slicing style); it disagrees with pycodestyle.
extend-ignore = E203
exclude = .git,__pycache__,build,install

[tool:pytest]
testpaths = test

[develop]
script_dir=$base/lib/um960_gps_driver
[install]
install_scripts=$base/lib/um960_gps_driver
