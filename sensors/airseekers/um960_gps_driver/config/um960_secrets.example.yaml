# Copy to config/um960_secrets.yaml (git-ignored) or, on the robot, to a file outside
# the repo, fill in your provider's details and pass it AFTER um960.yaml:
#   ros2 run um960_gps_driver um960_node --ros-args \
#     --params-file .../um960.yaml --params-file /path/to/um960_secrets.yaml
um960_node:
  ros__parameters:
    correction_source: "ntrip"
    ntrip_host: "caster.example.net"
    ntrip_port: 2101
    ntrip_mountpoint: "MOUNTPOINT"
    ntrip_user: "your-user"
    ntrip_password: "your-password"
