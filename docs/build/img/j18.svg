<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="-apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-labelledby="t">
  <title id="t">J18 red 9-pin connector pinout as used by the Mowgli community: GND, debug UART, 5 V, IMU SCL and SDA, VBat</title>
  <rect width="900" height="560" fill="#0f172a"/>
  <text x="450" y="44" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">J18 — red 9-pin header (mainboard)</text>
  <text x="450" y="70" text-anchor="middle" fill="#94a3b8" font-size="13">Community-verified on YardForce 500 / 500B. Confirm pin 1 against the silkscreen before wiring.</text>

  <!-- connector body -->
  <rect x="110" y="110" width="680" height="90" rx="10" fill="#dc2626" stroke="#fca5a5" stroke-width="3"/>
  <g font-size="14" font-weight="700" fill="#fff" text-anchor="middle">
    <g id="pins">
      <rect x="140" y="135" width="40" height="40" rx="4" fill="#0f172a"/><text x="160" y="161">1</text>
      <rect x="212" y="135" width="40" height="40" rx="4" fill="#0f172a"/><text x="232" y="161">2</text>
      <rect x="284" y="135" width="40" height="40" rx="4" fill="#0f172a"/><text x="304" y="161">3</text>
      <rect x="356" y="135" width="40" height="40" rx="4" fill="#0f172a"/><text x="376" y="161">4</text>
      <rect x="428" y="135" width="40" height="40" rx="4" fill="#0f172a"/><text x="448" y="161">5</text>
      <rect x="500" y="135" width="40" height="40" rx="4" fill="#0f172a"/><text x="520" y="161">6</text>
      <rect x="572" y="135" width="40" height="40" rx="4" fill="#0f172a"/><text x="592" y="161">7</text>
      <rect x="644" y="135" width="40" height="40" rx="4" fill="#0f172a"/><text x="664" y="161">8</text>
      <rect x="716" y="135" width="40" height="40" rx="4" fill="#0f172a"/><text x="736" y="161">9</text>
    </g>
  </g>
  <path d="M132,128 l0,-12 l12,0" stroke="#fff" stroke-width="2" fill="none"/>
  <text x="120" y="108" fill="#fca5a5" font-size="11">pin 1</text>

  <!-- table -->
  <g font-size="15" fill="#e2e8f0">
    <g transform="translate(150,250)">
      <text x="0" y="0" fill="#94a3b8" font-size="12" font-weight="700">PIN</text>
      <text x="60" y="0" fill="#94a3b8" font-size="12" font-weight="700">SIGNAL</text>
      <text x="330" y="0" fill="#94a3b8" font-size="12" font-weight="700">USE IN MOWGLINEXT</text>
      <line x1="0" y1="10" x2="600" y2="10" stroke="#334155"/>

      <text x="0" y="40" font-weight="700">1</text><text x="60" y="40">GND</text><text x="330" y="40" fill="#22c55e">IMU ground · DC-DC IN−</text>
      <text x="0" y="72" font-weight="700">2</text><text x="60" y="72">UART TX (debug)</text><text x="330" y="72" fill="#64748b">not used (optional firmware log)</text>
      <text x="0" y="104" font-weight="700">3</text><text x="60" y="104">UART RX (debug)</text><text x="330" y="104" fill="#64748b">not used</text>
      <text x="0" y="136" font-weight="700">4</text><text x="60" y="136">5 V</text><text x="330" y="136" fill="#22c55e">IMU VCC (WT901 / MPU6050 boards)</text>
      <text x="0" y="168" font-weight="700">5</text><text x="60" y="168">I²C SCL (PB3, bit-banged)</text><text x="330" y="168" fill="#22c55e">IMU SCL</text>
      <text x="0" y="200" font-weight="700">6</text><text x="60" y="200">I²C SDA (PB4, bit-banged)</text><text x="330" y="200" fill="#22c55e">IMU SDA</text>
      <text x="0" y="232" font-weight="700">7</text><text x="60" y="232">NC</text><text x="330" y="232" fill="#64748b">—</text>
      <text x="0" y="264" font-weight="700">8</text><text x="60" y="264">VBat ≈ 29 V (2 A max)</text><text x="330" y="264" fill="#facc15">DC-DC IN+ (alternative to J3)</text>
      <text x="0" y="296" font-weight="700">9</text><text x="60" y="296">NC</text><text x="330" y="296" fill="#64748b">—</text>
    </g>
  </g>
</svg>
