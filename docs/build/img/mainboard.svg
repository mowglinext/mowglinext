<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="-apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Schematic map of the YardForce mainboard connectors used by MowgliNext (not to scale)</title>
  <rect width="900" height="560" fill="#0f172a"/>
  <text x="450" y="36" text-anchor="middle" fill="#94a3b8" font-size="13">Schematic — positions are indicative, read the silkscreen labels on your board</text>

  <!-- board -->
  <rect x="120" y="70" width="660" height="420" rx="14" fill="#14532d" stroke="#22c55e" stroke-width="3"/>
  <rect x="140" y="90" width="620" height="380" rx="8" fill="#166534" opacity="0.5"/>

  <!-- STM32 -->
  <rect x="400" y="230" width="100" height="100" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
  <text x="450" y="275" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">STM32</text>
  <text x="450" y="293" text-anchor="middle" fill="#94a3b8" font-size="10">F103 (500) / F401 (500B)</text>
  <circle cx="530" cy="250" r="5" fill="#22c55e"/>
  <text x="540" y="254" fill="#22c55e" font-size="10">D3 LED</text>

  <!-- J9 SWD -->
  <rect x="560" y="110" width="120" height="40" rx="6" fill="#1e293b" stroke="#facc15" stroke-width="2"/>
  <text x="620" y="128" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">J9 — SWD</text>
  <text x="620" y="143" text-anchor="middle" fill="#facc15" font-size="10">GND · SWCLK · SWDIO · 3V3</text>
  <text x="620" y="170" text-anchor="middle" fill="#e2e8f0" font-size="11">ST-Link → firmware</text>

  <!-- J14 USB -->
  <rect x="160" y="110" width="120" height="40" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="220" y="128" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">J14 — USB</text>
  <text x="220" y="143" text-anchor="middle" fill="#38bdf8" font-size="10">to the Pi (A↔A cable)</text>

  <!-- J18 -->
  <rect x="160" y="400" width="200" height="40" rx="6" fill="#dc2626" stroke="#fca5a5" stroke-width="2"/>
  <text x="260" y="418" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">J18 — red 9-pin</text>
  <text x="260" y="433" text-anchor="middle" fill="#fee2e2" font-size="10">IMU I²C · 5 V · VBat · debug UART</text>

  <!-- J3 -->
  <rect x="580" y="400" width="120" height="40" rx="6" fill="#1e293b" stroke="#facc15" stroke-width="2"/>
  <text x="640" y="418" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">J3 — VBat</text>
  <text x="640" y="433" text-anchor="middle" fill="#facc15" font-size="10">29 V for the DC-DC</text>

  <!-- J6 panel -->
  <rect x="380" y="110" width="120" height="40" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <text x="440" y="128" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">J6 — panel</text>
  <text x="440" y="143" text-anchor="middle" fill="#94a3b8" font-size="10">keep it plugged in</text>

  <!-- motors -->
  <rect x="160" y="230" width="110" height="60" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <text x="215" y="255" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Wheel motors</text>
  <text x="215" y="273" text-anchor="middle" fill="#94a3b8" font-size="10">L / R + encoders</text>

  <rect x="630" y="230" width="110" height="60" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <text x="685" y="255" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Blade motor</text>
  <text x="685" y="273" text-anchor="middle" fill="#94a3b8" font-size="10">ESC UART</text>

  <rect x="400" y="400" width="140" height="40" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <text x="470" y="418" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Charge contacts</text>
  <text x="470" y="433" text-anchor="middle" fill="#94a3b8" font-size="10">dock</text>

  <!-- legend -->
  <g font-size="12" fill="#e2e8f0">
    <rect x="120" y="510" width="14" height="14" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="142" y="522">data link to the Pi</text>
    <rect x="300" y="510" width="14" height="14" rx="3" fill="#1e293b" stroke="#facc15" stroke-width="2"/><text x="322" y="522">power / programming</text>
    <rect x="500" y="510" width="14" height="14" rx="3" fill="#dc2626" stroke="#fca5a5" stroke-width="2"/><text x="522" y="522">J18 (red) — IMU + power tap</text>
  </g>
</svg>
