name: Host updater
on:
  push:
    # Bootstrap addresses the exact checkout SHA, including docs/sensor-only
    # commits. Only the supported install branches publish one: a release per
    # push on every branch passed 1,000 releases in October 2026, past the
    # stable picker's scan window. Custom branches use MOWGLI_UPDATER_BINARY.
    branches: [main, dev]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, dev]
    paths: ['gui/**', 'install/**', 'ros2/**', 'docker/**', '.github/workflows/updater.yml', '.github/workflows/deployment-release.yml', '.github/scripts/publish-stable-deployment.sh']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: gui/go.mod
          cache-dependency-path: gui/go.sum
      - name: Test updater and installer
        env:
          MOWGLI_UPDATER_DOCKER_TESTS: '1'
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iros2/src/mowgli_interfaces/include ros2/src/mowgli_interfaces/test/test_update_maintenance.cpp -o /tmp/test-update-maintenance
          /tmp/test-update-maintenance
          cd gui
          go test -race ./pkg/updater ./pkg/api
          go build -o "$RUNNER_TEMP/mowgli-updater-installer-test" ./cmd/mowgli-updater
          export MOWGLI_UPDATER_STACK_BINARY="$RUNNER_TEMP/mowgli-updater-installer-test"
          cd ..
          bash install/tests/test_updater.sh
          bash install/tests/test_deployment_publication.sh
          bash install/tests/test_compose_validity.sh
          bash install/tests/test_idempotency.sh
          bash install/tests/test_compose_legacy_adoption.sh
          bash install/tests/test_repo_self_update.sh
      - name: Cross-build static host binaries
        env:
          REVISION: ${{ github.sha }}
        run: |
          mkdir -p dist
          cd gui
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "-s -w -X github.com/mowglinext/mowglinext/pkg/updater.Version=updater-${REVISION} -X github.com/mowglinext/mowglinext/pkg/updater.Revision=${REVISION}" -o "../dist/mowgli-updater-linux-$arch" ./cmd/mowgli-updater
          done
          cd ../dist
          sha256sum mowgli-updater-linux-* > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: updater-binaries
          path: dist/*
  publish:
    needs: test-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: updater-binaries
          path: dist
      - name: Publish immutable installer bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          if ! gh release view "updater-$REVISION" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "updater-$REVISION" dist/* --repo "$REPO" --target "$REVISION" --prerelease --title "Updater $REVISION" --notes 'Installer bootstrap binaries. Not a complete container deployment.'
          fi
      - name: Prune old installer bootstraps
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Keep 30 days of bootstraps, plus every version tag's commit and the
          # main/dev heads: those are the checkouts the installer is run from.
          cutoff="$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          keep="$({
            gh api --paginate "repos/$REPO/tags?per_page=100" -q '.[] | select(.name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | .commit.sha'
            gh api "repos/$REPO/commits/main" -q .sha
            gh api "repos/$REPO/commits/dev" -q .sha
          } | sed 's/^/updater-/')"
          gh api --paginate "repos/$REPO/releases?per_page=100" \
            -q ".[] | select(.prerelease and (.tag_name | test(\"^updater-[0-9a-f]{40}$\")) and .created_at < \"$cutoff\") | .tag_name" |
            grep -vxF -f <(printf '%s\n' "$keep") |
            while read -r tag; do
              gh release delete "$tag" --repo "$REPO" --yes --cleanup-tag || echo "::warning::could not delete $tag"
            done
