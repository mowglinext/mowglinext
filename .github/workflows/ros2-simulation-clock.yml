name: ROS2 — Simulation clock image

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'ros2/Dockerfile'
      - 'ros2/patches/webots-supervisor-clock.patch'
      - 'ros2/src/mowgli_simulation/test/test_webots_supervisor_clock.py'
      - '.github/workflows/ros2-simulation-clock.yml'
  push:
    branches: [main, dev]
    paths:
      - 'ros2/Dockerfile'
      - 'ros2/patches/webots-supervisor-clock.patch'
      - 'ros2/src/mowgli_simulation/test/test_webots_supervisor_clock.py'
      - '.github/workflows/ros2-simulation-clock.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: simulation-clock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clock-image:
    name: Installed Webots clock (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Make room for simulator build
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR for existing build cache
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve cache reference
        run: echo "RUNTIME_CACHE=ghcr.io/${GITHUB_REPOSITORY,,}/mowgli-ros2:buildcache-amd64" >> "$GITHUB_ENV"

      - name: Build complete simulator and clock-test layer
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./ros2/Dockerfile
          target: simulation-clock-test
          platforms: linux/amd64
          load: true
          push: false
          tags: mowgli-simulation-clock:test
          cache-from: |
            type=registry,ref=${{ env.RUNTIME_CACHE }}
            type=gha,scope=simulation-clock-amd64
          cache-to: type=gha,scope=simulation-clock-amd64,mode=max
          provenance: false
          sbom: false

      - name: Run installed callback regressions without skips
        run: |
          mkdir -p "$RUNNER_TEMP/webots-clock-results"
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$RUNNER_TEMP/webots-clock-results:/results" \
            mowgli-simulation-clock:test
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          result = Path(os.environ["RUNNER_TEMP"]) / "webots-clock-results/webots-clock.xml"
          suites = ET.parse(result).getroot().findall("testsuite")
          totals = {
              key: sum(int(suite.get(key, 0)) for suite in suites)
              for key in ("tests", "skipped", "failures", "errors")
          }
          assert totals == {"tests": 20, "skipped": 0, "failures": 0, "errors": 0}, totals
          print(totals)
          PY

      - name: Upload clock results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installed-webots-clock
          path: ${{ runner.temp }}/webots-clock-results/*.xml
          if-no-files-found: ignore
          retention-days: 7
