  # -------------------------------------------------------------------------
  # OpenMower GUI — Go backend + React frontend
  # Connects to mowgli's foxglove_bridge WebSocket on ws://localhost:8765
  # -------------------------------------------------------------------------
services:
  gui:
    container_name: mowgli-gui
    image: ${GUI_IMAGE}
    labels:
      garden.mowgli.update.image: mowglinext-gui
      com.centurylinklabs.watchtower.enable: "true"
      project: mowglinext
      app: gui
    network_mode: host
    # pid: host lets the GUI backend enter host init's namespaces (nsenter -t 1)
    # to run the host's `systemctl reboot`/`poweroff` for the Restart/Shutdown Pi
    # power-menu actions. Without it a container can't power-cycle its host.
    pid: host
    privileged: true
    environment:
      FOXGLOVE_URL: ws://localhost:8765
      MOWER_CONFIG_FILE: /config/mower_config.sh
      MOWER_YAML_CONFIG_FILE: /mowgli_config/mowgli_robot.yaml
      MOWER_RUNTIME_ENV_FILE: /runtime_config/.env
      DOCKER_HOST: unix:///var/run/docker.sock
      DB_PATH: /db
    volumes:
      - ./docker/config/db:/db
      - ./docker/config/om:/config:ro
      - ./docker/config/mowgli:/mowgli_config
      - ./docker:/runtime_config
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev:/dev
      - mowgli_maps:/ros2_ws/maps
      # The scheduler compares each schedule's HH:mm against THIS container's clock,
      # so it must run in the host's time zone. Without this the container is UTC
      # and a schedule set for 08:15 fires at 08:15 UTC (10:15 CEST) — field report
      # 2026-10-06. /etc/localtime only (not /etc/timezone, which a bind mount would
      # turn into an empty directory on hosts that lack the file).
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - mowgli
    restart: unless-stopped
