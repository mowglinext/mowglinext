  # -------------------------------------------------------------------------
  # Airseekers Tron hardware bridge (HARDWARE_BACKEND=airseekers).
  #
  # The Tron's vendor chassis/cutter MCU, WIT JY61P IMU, top-panel keys and
  # UM960 GNSS stay on their own firmware; this sidecar speaks to them and
  # publishes MowgliNext's hardware_bridge contract
  # (/hardware_bridge/{status,emergency,power,dig_escalated,cmd_vel_applied},
  # /battery_state, /imu/data, /wheel_odom, /wheel_ticks, mower_control +
  # emergency_stop services) plus /gps/fix and /gps/status (the backend
  # defaults set gnss_stack: disabled, so install with GNSS_STACK=disabled and
  # no gps container). mowgli-ros2 skips its own hardware_bridge_node for this
  # backend (mowgli.launch.py gates it on HARDWARE_BACKEND=mowgli).
  # See sensors/airseekers/README.md.
  # -------------------------------------------------------------------------
x-ros2-env: &ros2-env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
  CYCLONEDDS_URI: file:///cyclonedds.xml
  ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
  RCUTILS_COLORIZED_OUTPUT: "1"
  RCUTILS_LOGGING_USE_STDOUT: "1"

services:

  airseekers:
    container_name: mowgli-airseekers
    labels:
      garden.mowgli.update.image: airseekers
    image: ${AIRSEEKERS_IMAGE}
    network_mode: host
    ipc: host
    privileged: true
    environment:
      <<: *ros2-env
      HARDWARE_BACKEND: ${HARDWARE_BACKEND:-airseekers}
      # Optional installer wiring; the GUI (mowgli_robot.yaml) wins over it.
      AIRSEEKERS_MCU_PORT: ${AIRSEEKERS_MCU_PORT:-}
      AIRSEEKERS_IMU_PORT: ${AIRSEEKERS_IMU_PORT:-}
    volumes:
      - /dev:/dev
      # Read-only: this bridge only READS the sparse robot config. The single
      # writer of that file remains mowgli-ros2.
      - ./docker/config/mowgli:/config:ro
      - ./docker/config/cyclonedds.xml:/cyclonedds.xml:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 5m
