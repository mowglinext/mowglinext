  # External Universal GNSS runtime. The stable gps service/container names
  # are retained for operational compatibility; the runtime image is selected
  # through UNIVERSAL_GNSS_IMAGE and is independent from MowgliNext IMAGE_TAG.
x-ros2-env: &ros2-env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
  ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
  RCUTILS_COLORIZED_OUTPUT: "1"
  RCUTILS_LOGGING_USE_STDOUT: "1"
  # Use the bundled cyclonedds.xml so MaxAutoParticipantIndex=500 takes
  # effect — without it cyclone caps at 9 per host and the
  # gps_health_aggregator side-process fails with "Failed to find a
  # free participant index".
  CYCLONEDDS_URI: file:///cyclonedds.xml

services:

  gps:
    container_name: mowgli-gps
    labels:
      garden.mowgli.update.image: gps
    # Pinned by digest here too, so a robot that reaches this fragment through
    # the updater (no installer run, no UNIVERSAL_GNSS_IMAGE in its .env) still
    # resolves an image. Must match install/lib/config.sh + install/deployment.json
    # (test_gnss_external_sidecar_contract.sh).
    image: ${UNIVERSAL_GNSS_IMAGE:-ghcr.io/pepeuch/universal-gnss-ros2-lyrical:v0.7.1-rc3@sha256:4e7960132882f2f83fb2b1e7d1430b4dfd00081d4be15d7d8ab20dacf7f22bc5}
    network_mode: host
    ipc: host
    environment:
      <<: *ros2-env
      UNIVERSAL_GNSS_CONFIGURATION_SCHEMA_VERSION: "1"
      # Logs and exports live in the tmpfs below, NOT in a volume: the host
      # updater refuses a release that adds writable storage ("explicit
      # data/layout migration required" — there is no backup contract for it),
      # and nothing here needs to outlive the container. Node output already
      # goes to stdout, i.e. the rotated json-file log.
      ROS_LOG_DIR: /run/universal_gnss/log
      UNIVERSAL_GNSS_EXPORT_DIR: /run/universal_gnss/export
    # mowgli_robot.yaml is the ONE GNSS configuration (receiver, serial port,
    # NTRIP), edited in the GUI. There is deliberately no derived parameters
    # file on the host and no GNSS_* variable in .env: both went stale the
    # moment the operator changed a setting, and a robot updated through the
    # GUI never had them at all. The receiver's port is whatever
    # gnss_serial_device names, hence /dev + the tty cgroup rules rather than a
    # single device mapped at `up` time. NOT privileged.
    volumes:
      - ./docker/config/mowgli:/config:ro
      - /dev:/dev
      - ./docker/config/cyclonedds.xml:/cyclonedds.xml:ro
    tmpfs:
      # Holds the generated ROS parameter file (NTRIP password inside), the
      # launch logs and the exports: memory only, bounded, private to the
      # runtime user, gone with the container.
      - /run/universal_gnss:uid=1000,gid=1000,mode=0700,size=64m
    device_cgroup_rules:
      - "c 166:* rw"   # ttyACM*  (USB CDC receivers)
      - "c 188:* rw"   # ttyUSB*  (USB-serial adapters)
      - "c 204:* rw"   # ttyAMA*  (Pi PL011 UARTs)
      - "c 4:* rw"     # ttyS*    (8250 UARTs)
    group_add:
      - "${GNSS_DEVICE_GID:-20}"   # dialout
    command:
      - python3
      - -c
      - |
        # Universal GNSS launcher: mowgli_robot.yaml -> ROS parameters.
        # The installed file is SPARSE, so every key needs a default here; they
        # mirror the mowgli_bringup template (test_gnss_sidecar_launcher.py).
        import os
        import sys
        import yaml

        DEFAULTS = {
            "gnss_receiver_family": "auto",
            "gnss_transport": "serial",
            "gnss_serial_device": "/dev/ttyAMA4",
            "gnss_serial_baud": 921600,
            "gnss_profile_rate_hz": 5,
            "gnss_frame_id": "gps_link",
            "ntrip_enabled": False,
            "ntrip_host": "",
            "ntrip_port": 2101,
            "ntrip_user": "",
            "ntrip_password": "",
            "ntrip_mountpoint": "",
            "gnss_ntrip_gga_enabled": True,
            "gnss_ntrip_gga_interval_s": 10,
        }
        CONFIG = os.environ.get("MOWGLI_ROBOT_CONFIG", "/config/mowgli_robot.yaml")
        RUN_DIR = os.environ.get("UNIVERSAL_GNSS_RUN_DIR", "/run/universal_gnss")


        def truthy(value):
            if isinstance(value, bool):
                return value
            return str(value).strip().lower() in ("true", "1", "yes", "on")


        def build(config):
            p = dict(DEFAULTS)
            p.update({k: v for k, v in config.items() if k in DEFAULTS and v is not None})
            host = str(p["ntrip_host"]).strip()
            mountpoint = str(p["ntrip_mountpoint"]).strip()
            ntrip = truthy(p["ntrip_enabled"]) and bool(host) and bool(mountpoint)
            if truthy(p["ntrip_enabled"]) and not ntrip:
                print("universal_gnss_launcher event=ntrip_disabled reason=host_or_mountpoint_empty",
                      file=sys.stderr)
            params = {
                "/universal_gnss_receiver": {"ros__parameters": {
                    "receiver_family": str(p["gnss_receiver_family"]),
                    "transport": str(p["gnss_transport"]),
                    "serial_device": str(p["gnss_serial_device"]),
                    "serial_baud": int(p["gnss_serial_baud"]),
                    "publish_rate_hz": float(p["gnss_profile_rate_hz"]),
                    "frame_id": str(p["gnss_frame_id"]),
                }},
                "/universal_gnss_ntrip": {"ros__parameters": {
                    "caster_host": host,
                    "caster_port": int(p["ntrip_port"]),
                    "mountpoint": mountpoint,
                    "username": str(p["ntrip_user"]),
                    "password": str(p["ntrip_password"]),
                    "gga_enabled": truthy(p["gnss_ntrip_gga_enabled"]),
                    "gga_interval_s": int(p["gnss_ntrip_gga_interval_s"]),
                    "tls_enabled": False,
                }},
            }
            return params, ntrip


        def main():
            with open(CONFIG, "r", encoding="utf-8") as handle:
                document = yaml.safe_load(handle) or {}
            config = (document.get("mowgli") or {}).get("ros__parameters") or {}
            params, ntrip = build(config)
            path = os.path.join(RUN_DIR, "parameters.yaml")
            descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
            with os.fdopen(descriptor, "w", encoding="utf-8") as handle:
                yaml.safe_dump(params, handle, default_flow_style=False)
            flag = os.path.join(RUN_DIR, "ntrip_enabled")
            if ntrip:
                open(flag, "w").close()
            elif os.path.exists(flag):
                os.remove(flag)
            print("universal_gnss_launcher event=start device=%s family=%s ntrip=%s" % (
                params["/universal_gnss_receiver"]["ros__parameters"]["serial_device"],
                params["/universal_gnss_receiver"]["ros__parameters"]["receiver_family"],
                str(ntrip).lower()), file=sys.stderr)
            os.execvp("ros2", [
                "ros2", "launch", "universal_gnss_ros2", "receiver_and_ntrip.launch.py",
                "parameters_file:=" + path,
                "fix_topic:=/gps/fix",
                "status_topic:=/universal_gnss_receiver/status",
                "rtcm_topic:=/universal_gnss_receiver/rtcm",
                "ntrip_enabled:=" + ("true" if ntrip else "false"),
            ])


        if __name__ == "__main__":
            main()
    healthcheck:
      test:
        - CMD
        # Docker health probes do not inherit the entrypoint's ROS environment.
        - /usr/local/bin/universal-gnss-entrypoint
        - python3
        - -c
        - |
          import pathlib
          import sys
          import rclpy
          from std_srvs.srv import Trigger

          def responsive(node, service):
              client = node.create_client(Trigger, service)
              try:
                  if not client.wait_for_service(timeout_sec=2.0):
                      return False
                  future = client.call_async(Trigger.Request())
                  rclpy.spin_until_future_complete(node, future, timeout_sec=2.0)
                  return (future.done() and future.exception() is None
                          and future.result() is not None and future.result().success)
              finally:
                  node.destroy_client(client)

          def main():
              services = ["/universal_gnss_receiver/get_health"]
              if pathlib.Path("/run/universal_gnss/ntrip_enabled").exists():
                  services.append("/universal_gnss_ntrip/get_health")
              rclpy.init()
              node = rclpy.create_node("mowgli_gnss_container_healthcheck")
              try:
                  for service in services:
                      if not responsive(node, service):
                          print("GNSS health check failed: " + service, file=sys.stderr)
                          return 1
                  return 0
              finally:
                  node.destroy_node()
                  rclpy.shutdown()

          if __name__ == "__main__":
              sys.exit(main())
      interval: 30s
      timeout: 12s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 5m
