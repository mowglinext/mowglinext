  # External Universal GNSS runtime. The stable `gps` service/container names
  # are retained for operational compatibility; this image is independently
  # selected through UNIVERSAL_GNSS_IMAGE, never MowgliNext IMAGE_TAG.
x-ros2-env: &ros2-env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
  ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
  RCUTILS_COLORIZED_OUTPUT: "1"
  RCUTILS_LOGGING_USE_STDOUT: "1"
  # Use the bundled cyclonedds.xml so MaxAutoParticipantIndex=500 takes
  # effect — without it cyclone caps at 9 per host and the
  # gps_health_aggregator side-process fails with "Failed to find a
  # free participant index".
  CYCLONEDDS_URI: file:///cyclonedds.xml

services:

  gps:
    container_name: mowgli-gps
    image: ${UNIVERSAL_GNSS_IMAGE}
    network_mode: host
    ipc: host
    environment:
      <<: *ros2-env
      UNIVERSAL_GNSS_CONFIGURATION_SCHEMA_VERSION: "1"
      UNIVERSAL_GNSS_EXPORT_DIR: /var/lib/universal_gnss/export
      GNSS_NTRIP_ENABLED: ${GNSS_NTRIP_ENABLED:-true}
    devices:
      - "${GNSS_DEVICE}:/dev/gnss-receiver"
    group_add:
      - "${GNSS_DEVICE_GID:-20}"
    volumes:
      - ./docker/config/universal_gnss/parameters.yaml:/etc/universal_gnss/parameters.yaml:ro
      - type: bind
        source: ${UNIVERSAL_GNSS_LOG_DIR}
        target: /var/log/universal_gnss
      - type: bind
        source: ${UNIVERSAL_GNSS_EXPORT_DIR}
        target: /var/lib/universal_gnss/export
      - ./docker/config/cyclonedds.xml:/cyclonedds.xml:ro
    # The receiver-only branch deliberately avoids starting NTRIP when it is
    # disabled; it does not simulate a caster.
    command:
      - /bin/bash
      - -lc
      - >-
        if [ "$${GNSS_NTRIP_ENABLED}" = "true" ]; then
          exec ros2 launch universal_gnss_ros2 receiver_and_ntrip.launch.py
          parameters_file:=/etc/universal_gnss/parameters.yaml --ros-args
          -r /universal_gnss_receiver/fix:=/gps/fix
          -r /universal_gnss_ntrip/status:=/universal_gnss_receiver/status
          -r /universal_gnss_ntrip/rtcm:=/universal_gnss_receiver/rtcm;
        fi;
        exec ros2 run universal_gnss_ros2 receiver_node --ros-args
        --params-file /etc/universal_gnss/parameters.yaml
        -r /universal_gnss_receiver/fix:=/gps/fix
    # The upstream default requires NTRIP. This remains a bounded service
    # responsiveness check for each component actually started.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ "$${GNSS_NTRIP_ENABLED}" = "true" ]; then
          /usr/local/bin/universal-gnss-healthcheck --timeout 2;
          else timeout 4 ros2 service call /universal_gnss_receiver/get_health
          std_srvs/srv/Trigger '{}' | grep -q 'success: true'; fi
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 5m
