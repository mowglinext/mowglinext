  types.FirmwareAvailability:
    properties:
      available:
        type: boolean
      board:
        type: string
      fw_version:
        type: string
      own_release:
        type: boolean
      panel:
        type: string
      protocol_version:
        type: integer
      release:
        description: |-
          Release the manifest came from; OwnRelease is false when this
          installation's release carries no firmware and the latest stable one
          was used instead.
        type: string
    type: object
  types.FirmwareConfig:
    properties:
      batChargeCutoffVoltage:
        type: number
      boardType:
        type: string
      boardTypeOrigin:
        description: |-
          Firmware selection provenance is written alongside the saved config so
          later mower-model changes can update only fields that still follow model
          defaults. Empty/unknown values are legacy and are handled conservatively
          by the GUI.
        type: string
      bothWheelsLiftEmergencyMillis:
        type: integer
      branch:
        type: string
      directory:
        type: string
      disableEmergency:
        type: boolean
      expertBuild:
        description: |-
          ExpertBuild routes the flash to the compile-from-source path
          (flashMowgli); the default (false) flashes a prebuilt binary. Kept for
          backward compatibility — FirmwareSource == "custom" implies it.
        type: boolean
      externalImuAcceleration:
        type: boolean
      externalImuAngular:
        type: boolean
      file:
        type: string
      firmwareSelectionModel:
        type: string
      firmwareSource:
        description: |-
          FirmwareSource is the GUI dropdown selector: "custom" compiles from
          source (the expert path), "prebuilt" (or empty, for older payloads)
          flashes the tested prebuilt binary.
        type: string
      firmwareTarget:
        description: |-
          FirmwareTarget is an exact PlatformIO/release-manifest environment for
          boards with multiple firmware variants. Empty preserves legacy routing.
        type: string
      firmwareTargetOrigin:
        type: string
      imuOnboardInclinationThreshold:
        type: integer
      limitVoltage150MA:
        type: number
      masterJ18:
        type: boolean
      maxChargeCurrent:
        type: number
      maxChargeVoltage:
        type: number
      maxMps:
        type: number
      oneWheelLiftEmergencyMillis:
        type: integer
      panelType:
        type: string
      panelTypeOrigin:
        type: string
      perimeterWire:
        type: boolean
      playButtonClearEmergencyMillis:
        type: integer
      repository:
        type: string
      stopButtonEmergencyMillis:
        type: integer
      tickPerM:
        type: number
      tiltEmergencyMillis:
        type: integer
      version:
        type: string
      wheelBase:
        type: number
    type: object
  types.SoilStatus:
