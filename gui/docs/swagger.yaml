    type: object
  updates.Changelog:
    properties:
      features:
        items:
          $ref: '#/definitions/updates.ChangelogEntry'
        type: array
      fixes:
        items:
          $ref: '#/definitions/updates.ChangelogEntry'
        type: array
      other:
        description: Commits that are neither a feature nor a fix (ci, docs, test,
          chore, ...).
        type: integer
      total:
        type: integer
      truncated:
        description: |-
          The installed revision was not found in the first page of history, so
          the lists cover the most recent changes only.
        type: boolean
      url:
        type: string
