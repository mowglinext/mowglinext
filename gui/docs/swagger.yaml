  providers.RemoteAccessPhase:
    enum:
    - disabled
    - pulling
    - starting
    - running
    - error
    type: string
    x-enum-varnames:
    - RemoteAccessDisabled
    - RemoteAccessPulling
    - RemoteAccessStarting
    - RemoteAccessRunning
    - RemoteAccessError
  providers.RemoteAccessStatus:
    properties:
      backendState:
        description: |-
          BackendState mirrors tailscaled: NoState, NeedsLogin, NeedsMachineAuth,
          Stopped, Starting, Running.
        type: string
      checkedAt:
        type: string
      containerState:
        description: ContainerState is Docker's state string, or "absent".
        type: string
      dnsName:
        type: string
      enabled:
        type: boolean
      error:
        type: string
      health:
        items:
          type: string
        type: array
      hostname:
        type: string
      httpUrls:
        items:
          type: string
        type: array
      httpsUrl:
        type: string
      loginUrl:
        description: LoginUrl is set while the node waits for an interactive login.
        type: string
      magicDnsEnabled:
        type: boolean
      phase:
        $ref: '#/definitions/providers.RemoteAccessPhase'
      tailscaleIps:
        items:
          type: string
        type: array
      version:
        type: string
