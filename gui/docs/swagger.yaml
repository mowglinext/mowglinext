      - diagnostics
  /tools/blackbox/download/{name}:
    get:
      parameters:
      - description: Completed snapshot name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/x-ndjson
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: Download a completed timestamped blackbox timeline
      tags:
      - diagnostics
  /tools/blackbox/save:
    post:
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
