      summary: saves the mower configuration as YAML
      tags:
      - settings
  /settings/yaml/defaults:
    get:
      description: returns a flat key-value map of default values (the reset-to-default
        source)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: returns the schema default value for every known parameter
      tags:
      - settings
  /setup/firmware/available:
    get:
      description: Version and protocol of the prebuilt firmware that /setup/flashBoard
        would install for the saved board selection, taken from this installation's
        release (or the latest stable one when it carries none).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.FirmwareAvailability'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: prebuilt firmware available for the saved board
      tags:
      - setup
  /setup/flashBoard:
    post:
      consumes:
      - application/json
      description: flash the mower board with the given config
      parameters:
      - description: config
        in: body
        name: settings
        required: true
        schema:
          $ref: '#/definitions/types.FirmwareConfig'
      produces:
      - text/event-stream
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.OkResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: flash the mower board with the given config
      tags:
      - setup
  /system/info:
    get:
      description: get system info such as CPU temperature
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SystemInfo'
      summary: get system info
      tags:
      - system
  /system/reboot:
    post:
      description: reboots the Raspberry Pi
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.OkResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: reboot the system
      tags:
      - system
  /system/shutdown:
    post:
      description: shuts down the Raspberry Pi
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.OkResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: shutdown the system
      tags:
      - system
  /system/updater/{operation}:
    post:
      consumes:
      - application/json
      description: 'Same-origin JSON and X-Mowgli-Update: 1 are required. See docs/UPDATES.md
        for the operation contract.'
      parameters:
      - description: Operation
        enum:
        - policy
        - check
        - plan
        - apply
        - rollback
        - recover
        - notice
        - agent-update
        in: path
        name: operation
        required: true
        type: string
      - description: Must be 1
        in: header
        name: X-Mowgli-Update
        required: true
        type: string
      - description: Operation-specific request
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Review or control a coordinated software update
      tags:
      - updates
  /system/updater/state:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Read cached host updater status
      tags:
      - updates
  /system/updates:
    get:
      parameters:
      - description: Comparison channel
        enum:
        - stable
        - dev
        in: query
        name: channel
        required: true
        type: string
      - description: Check remote metadata (otherwise cached result)
        in: query
        name: check
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.UpdateCheck'
      summary: Check available software versions
      tags:
      - system
  /system/updates/changelog:
    get:
      description: Features and fixes read from the commit subjects between the installed
        and the candidate revision.
      parameters:
      - description: owner/name
        in: query
        name: repository
        required: true
        type: string
      - description: Installed 40-hex revision
        in: query
        name: installed
        required: true
        type: string
      - description: Candidate 40-hex revision
        in: query
        name: available
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/updates.Changelog'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: What changed between two source revisions
      tags:
      - system
  /system/versions:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.VersionsResponse'
      summary: Installed software versions
      tags:
      - system
  /tools/blackbox/{name}:
    delete:
      parameters:
      - description: Completed snapshot name
        in: path
