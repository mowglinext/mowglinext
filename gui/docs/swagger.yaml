basePath: /api
definitions:
  api.Container:
    properties:
      id:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      names:
        items:
          type: string
        type: array
      state:
        type: string
    type: object
  api.ContainerListResponse:
    properties:
      containers:
        items:
          $ref: '#/definitions/api.Container'
        type: array
    type: object
  api.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  api.GetConfigResponse:
    properties:
      tileUri:
        type: string
    type: object
  api.GetSettingsResponse:
    properties:
      settings:
        additionalProperties: {}
        type: object
    type: object
  api.ImportDockPose:
    properties:
      x:
        type: number
      "y":
        type: number
      yaw_rad:
        type: number
    type: object
  api.ImportOpenMowerRequest:
    properties:
      apply:
        type: boolean
      map:
        items:
          type: integer
        type: array
      om_datum_lat:
        type: number
      om_datum_lon:
        type: number
    type: object
  api.ImportOpenMowerSummary:
    properties:
      applied:
        type: boolean
      areas:
        items:
          $ref: '#/definitions/api.ImportedAreaBrief'
        type: array
      datum_shift_east_m:
        type: number
      datum_shift_north_m:
        type: number
      dock_pose:
        $ref: '#/definitions/api.ImportDockPose'
      mn_datum_configured:
        description: |-
          MnDatumConfigured is true when mowgli_robot.yaml already has a
          datum_lat/datum_lon set. The GUI uses this to decide whether to
          offer the "import the datum too" step: on a fresh install (false)
          the OpenMower datum can be adopted as the robot's datum; when a
          datum already exists (true) the geometry was reprojected INTO it,
          so overwriting it would misalign the just-imported map — the GUI
          then hides the datum-import option.
        type: boolean
      mowing_areas:
        type: integer
      navigation_areas:
        type: integer
      obstacles:
        type: integer
      orphan_obstacles:
        type: integer
      warnings:
        items:
          type: string
        type: array
    type: object
  api.ImportedAreaBrief:
    properties:
      approx_area_sqm:
        type: number
      is_navigation_area:
        type: boolean
      name:
        type: string
      obstacles:
        type: integer
      type:
        description: '"mow" | "nav"'
        type: string
      vertices:
        type: integer
    type: object
  api.InstalledComponent:
    properties:
      architecture:
        type: string
      built_at:
        type: string
      component:
        type: string
      digests:
        items:
          type: string
        type: array
      image:
        type: string
      image_id:
        type: string
      metadata_available:
        type: boolean
      name:
        type: string
      revision:
        type: string
      state:
        type: string
      version:
        type: string
    type: object
  api.IrriSenseErrorResponse:
    properties:
      code:
        type: string
      error:
        type: string
    type: object
  api.IrriSenseGardensResponse:
    properties:
      gardens:
        items:
          $ref: '#/definitions/providers.IrriSenseGardenSummary'
        type: array
    type: object
  api.IrriSenseSettingsResponse:
    properties:
      baseUrl:
        type: string
      dryAfterWateringHours:
        type: number
      enabled:
        type: boolean
      gardenId:
        type: string
      gateScheduler:
        type: boolean
      maxStaleMinutes:
        type: number
      tokenMasked:
        type: string
      tokenSet:
        type: boolean
      wetDeficitMm:
        type: number
      zoneIds:
        items:
          type: string
        type: array
    type: object
  api.IrriSenseSettingsUpdate:
    properties:
      baseUrl:
        type: string
      clearToken:
        type: boolean
      dryAfterWateringHours:
        type: number
      enabled:
        type: boolean
      gardenId:
        type: string
      gateScheduler:
        type: boolean
      maxStaleMinutes:
        type: number
      token:
        type: string
      wetDeficitMm:
        type: number
      zoneIds:
        items:
          type: string
        type: array
    type: object
  api.OkResponse:
    properties:
      ok:
        type: string
    type: object
  api.Schedule:
    properties:
      area:
        type: integer
      createdAt:
        type: string
      daysOfWeek:
        description: 0=Sunday .. 6=Saturday
        items:
          type: integer
        type: array
      enabled:
        type: boolean
      id:
        type: string
      lastRun:
        type: string
      lastSkipReason:
        description: |-
          Written by the scheduler when a due run was skipped (soil wet); the GUI
          shows them, the API only preserves them across updates.
        type: string
      lastSkippedAt:
        type: string
      time:
        description: HH:mm format
        type: string
    type: object
  api.ScheduleListResponse:
    properties:
      schedules:
        items:
          $ref: '#/definitions/api.Schedule'
        type: array
    type: object
  api.SettingsStatusResponse:
    properties:
      onboarding_completed:
        type: boolean
    type: object
  api.SystemInfo:
    properties:
      cpuTemperature:
        type: number
    type: object
  api.UpdateCheck:
    properties:
      channel:
        type: string
      checked_at:
        type: string
      components:
        items:
          $ref: '#/definitions/api.UpdateComponent'
        type: array
      last_successful_at:
        type: string
      notes_url:
        type: string
      state:
        type: string
      version:
        type: string
    type: object
  api.UpdateComponent:
    properties:
      available_image:
        type: string
      available_revision:
        type: string
      custom_image:
        type: boolean
      digest_reference:
        type: boolean
      installed_revision:
        type: string
      name:
        type: string
      source_relation:
        type: string
      state:
        type: string
    type: object
  api.VersionsResponse:
    properties:
      components:
        items:
          $ref: '#/definitions/api.InstalledComponent'
        type: array
      docker_available:
        type: boolean
      observed_at:
        type: string
      server:
        $ref: '#/definitions/buildinfo.Info'
    type: object
  buildinfo.Info:
    properties:
      built_at:
        type: string
      modified:
        type: boolean
      revision:
        type: string
      version:
        type: string
    type: object
  geometry.Point:
    properties:
      x:
        type: number
      "y":
        type: number
      z:
        type: number
    type: object
  geometry.Point32:
    properties:
      x:
        type: number
      "y":
        type: number
      z:
        type: number
    type: object
  geometry.Polygon:
    properties:
      points:
        items:
          $ref: '#/definitions/geometry.Point32'
        type: array
    type: object
  geometry.Pose:
    properties:
      orientation:
        $ref: '#/definitions/geometry.Quaternion'
      position:
        $ref: '#/definitions/geometry.Point'
    type: object
  geometry.Quaternion:
    properties:
      w:
        type: number
      x:
        type: number
      "y":
        type: number
      z:
        type: number
    type: object
  mowgli.AddMowingAreaReq:
    properties:
      area:
        $ref: '#/definitions/mowgli.MapArea'
      is_navigation_area:
        type: boolean
    type: object
  mowgli.MapArea:
    properties:
      area:
        $ref: '#/definitions/geometry.Polygon'
      is_navigation_area:
        type: boolean
      name:
        type: string
      obstacle_info:
        items:
          $ref: '#/definitions/mowgli.MapObstacleInfo'
        type: array
      obstacles:
        items:
          $ref: '#/definitions/geometry.Polygon'
        type: array
    type: object
  mowgli.MapObstacleInfo:
    properties:
      id:
        type: integer
      name:
        type: string
      pending:
        type: boolean
      source:
        type: integer
    type: object
  mowgli.ReplaceMapArea:
    properties:
      area:
        $ref: '#/definitions/mowgli.MapArea'
      is_navigation_area:
        type: boolean
    type: object
  mowgli.ReplaceMapReq:
    properties:
      areas:
        items:
          $ref: '#/definitions/mowgli.ReplaceMapArea'
        type: array
    type: object
  mowgli.SetDockingPointReq:
    properties:
      docking_pose:
        $ref: '#/definitions/geometry.Pose'
      use_gps_position:
        type: boolean
      yaw_rad:
        type: number
      yaw_source:
        type: integer
    type: object
  providers.IrriSenseGardenSummary:
    properties:
      id:
        type: string
      name:
        type: string
      zones:
        items:
          $ref: '#/definitions/providers.IrriSenseZoneSummary'
        type: array
    type: object
  providers.IrriSenseZoneSummary:
    properties:
      enabled:
        type: boolean
      id:
        type: string
      label:
        type: string
    type: object
  types.FirmwareConfig:
    properties:
      batChargeCutoffVoltage:
        type: number
      boardType:
        type: string
      boardTypeOrigin:
        description: |-
          Firmware selection provenance is written alongside the saved config so
          later mower-model changes can update only fields that still follow model
          defaults. Empty/unknown values are legacy and are handled conservatively
          by the GUI.
        type: string
      bothWheelsLiftEmergencyMillis:
        type: integer
      branch:
        type: string
      directory:
        type: string
      disableEmergency:
        type: boolean
      expertBuild:
        description: |-
          ExpertBuild routes the flash to the compile-from-source path
          (flashMowgli); the default (false) flashes a prebuilt binary. Kept for
          backward compatibility — FirmwareSource == "custom" implies it.
        type: boolean
      externalImuAcceleration:
        type: boolean
      externalImuAngular:
        type: boolean
      file:
        type: string
      firmwareSelectionModel:
        type: string
      firmwareSource:
        description: |-
          FirmwareSource is the GUI dropdown selector: "custom" compiles from
          source (the expert path), "prebuilt" (or empty, for older payloads)
          flashes the tested prebuilt binary.
        type: string
      imuOnboardInclinationThreshold:
        type: integer
      limitVoltage150MA:
        type: number
      masterJ18:
        type: boolean
      maxChargeCurrent:
        type: number
      maxChargeVoltage:
        type: number
      maxMps:
        type: number
      oneWheelLiftEmergencyMillis:
        type: integer
      panelType:
        type: string
      panelTypeOrigin:
        type: string
      perimeterWire:
        type: boolean
      playButtonClearEmergencyMillis:
        type: integer
      repository:
        type: string
      stopButtonEmergencyMillis:
        type: integer
      tickPerM:
        type: number
      tiltEmergencyMillis:
        type: integer
      version:
        type: string
      wheelBase:
        type: number
    type: object
  types.SoilStatus:
    properties:
      configured:
        type: boolean
      enabled:
        type: boolean
      error:
        type: string
      fetchedAt:
        type: string
      fresh:
        type: boolean
      gardenName:
        type: string
      gateScheduler:
        type: boolean
      reason:
        type: string
      unknown:
        type: boolean
      wet:
        type: boolean
      zones:
        items:
          $ref: '#/definitions/types.SoilZoneStatus'
        type: array
    type: object
  types.SoilZoneStatus:
    properties:
      deficitMm:
        type: number
      enabled:
        type: boolean
      id:
        type: string
      label:
        type: string
      lastWateredAt:
        type: string
      reason:
        type: string
      selected:
        type: boolean
      wet:
        type: boolean
    type: object
host: localhost:4200
info:
  contact: {}
  description: API for the MowgliNext autonomous robot mower GUI
  title: MowgliNext GUI API
  version: "1.0"
paths:
  /config/envs:
    get:
      description: get config env from backend
      produces:
      - application/json
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.GetConfigResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: get config env from backend
      tags:
      - config
  /config/keys/get:
    post:
      description: get config from backend
      parameters:
      - description: settings
        in: body
        name: settings
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: get config from backend
      tags:
      - config
  /config/keys/set:
    post:
      description: set config to backend
      parameters:
      - description: settings
        in: body
        name: settings
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: set config to backend
      tags:
      - config
  /containers:
    get:
      description: list all containers
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ContainerListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: list all containers
      tags:
      - containers
  /containers/{containerId}/{command}:
    post:
      description: execute a command on a container
      parameters:
      - description: container id
        in: path
        name: containerId
        required: true
        type: string
      - description: command to execute (start/stop/restart)
        in: path
        name: command
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.OkResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: execute a command on a container
      tags:
      - containers
  /containers/{containerId}/logs:
    get:
      description: get container logs
      parameters:
      - description: container id
        in: path
        name: containerId
        required: true
        type: string
      produces:
      - text/event-stream
      responses: {}
      summary: get container logs
      tags:
      - containers
  /import/openmower:
    post:
      consumes:
      - application/json
      description: |-
        Parse a user-supplied OpenMower map.json, translate it
        into MowgliNext's coordinate frame, and return a summary
        for confirmation. Setting `apply=true` runs the live write
        path (areas + dock pose). See docs/IMPORT_OPENMOWER_MAP.md.
      parameters:
      - description: import request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.ImportOpenMowerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ImportOpenMowerSummary'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: import an OpenMower map.json (preview-only by default)
      tags:
      - import
  /irrisense/gardens:
    get:
      description: gardens readable by the stored token, for the picker and "test
        connection"
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.IrriSenseGardensResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.IrriSenseErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/api.IrriSenseErrorResponse'
      summary: list IrriSense gardens
      tags:
      - irrisense
  /irrisense/settings:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.IrriSenseSettingsResponse'
      summary: IrriSense settings
      tags:
      - irrisense
    put:
      consumes:
      - application/json
      parameters:
      - description: partial settings
        in: body
        name: settings
        required: true
        schema:
          $ref: '#/definitions/api.IrriSenseSettingsUpdate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.IrriSenseSettingsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: update IrriSense settings
      tags:
      - irrisense
  /irrisense/status:
    get:
      description: cached wet/dry/unknown verdict the scheduler gate reads
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.SoilStatus'
      summary: IrriSense soil status
      tags:
      - irrisense
  /mowglinext/call/{command}:
    post:
      consumes:
      - application/json
      description: call a service
      parameters:
      - description: 'command to call, could be: high_level_control, emergency, mow_enabled,
          start_in_area'
        in: path
        name: command
        required: true
        type: string
      - description: request body
        in: body
        name: CallReq
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.OkResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: call a service
      tags:
      - mowglinext
  /mowglinext/map:
    delete:
      consumes:
      - application/json
      description: clear the map
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.OkResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: clear the map
      tags:
      - mowglinext
    put:
      consumes:
      - application/json
      description: clear the map and insert all provided areas in a single transaction
      parameters:
      - description: replace map request body
        in: body
        name: CallReq
        required: true
        schema:
          $ref: '#/definitions/mowgli.ReplaceMapReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.OkResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Delete the current map and replace all areas
      tags:
      - mowglinext
  /mowglinext/map/area/add:
    post:
      consumes:
      - application/json
      description: add a map area
      parameters:
      - description: request body
        in: body
        name: CallReq
        required: true
        schema:
          $ref: '#/definitions/mowgli.AddMowingAreaReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.OkResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: add a map area
      tags:
      - mowglinext
  /mowglinext/map/docking:
    post:
      consumes:
      - application/json
      description: set the docking point
      parameters:
      - description: request body
        in: body
        name: CallReq
        required: true
        schema:
          $ref: '#/definitions/mowgli.SetDockingPointReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.OkResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: set the docking point
      tags:
      - mowglinext
  /mowglinext/multiplex:
    get:
      description: multiplexed topic subscription
      responses: {}
      summary: multiplexed topic subscription
      tags:
      - mowglinext
  /mowglinext/publish/{topic}:
    get:
      description: publish to a topic
      parameters:
      - description: 'topic to publish to, could be: joy'
        in: path
        name: topic
        required: true
        type: string
      responses: {}
      summary: publish to a topic
      tags:
      - mowglinext
  /mowglinext/subscribe/{topic}:
    get:
      description: subscribe to a topic
      parameters:
      - description: 'logical topic key: diagnostics, status, highLevelStatus, gps,
          gnssStatus, pose, imu, ticks, map, path, plan, mowingPath, power, emergency,
          dockingSensor, lidar'
        in: path
        name: topic
        required: true
        type: string
      responses: {}
      summary: subscribe to a topic
      tags:
      - mowglinext
  /schedules:
    get:
      description: list all mowing schedules
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ScheduleListResponse'
      summary: list all schedules
      tags:
      - schedules
    post:
      consumes:
      - application/json
      description: create a new mowing schedule
      parameters:
      - description: schedule
        in: body
        name: schedule
        required: true
        schema:
          $ref: '#/definitions/api.Schedule'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Schedule'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: create a schedule
      tags:
      - schedules
  /schedules/{id}:
    delete:
      description: delete a mowing schedule
      parameters:
      - description: schedule ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.OkResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: delete a schedule
      tags:
      - schedules
    put:
      consumes:
      - application/json
      description: update an existing mowing schedule
      parameters:
      - description: schedule ID
        in: path
        name: id
        required: true
        type: string
      - description: schedule
        in: body
        name: schedule
        required: true
        schema:
          $ref: '#/definitions/api.Schedule'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Schedule'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: update a schedule
      tags:
      - schedules
  /settings:
    get:
      description: returns a JSON object with the settings
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.GetSettingsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: returns a JSON object with the settings
      tags:
      - settings
    post:
      consumes:
      - application/json
