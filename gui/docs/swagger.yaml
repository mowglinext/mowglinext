        additionalProperties: {}
        type: object
    type: object
  api.HardwareBackendResponse:
    properties:
      backend:
        type: string
      default_overrides:
        additionalProperties: {}
        description: |-
          DefaultOverrides are the settings whose default this backend replaces
          (config/backends/<backend>.yaml). A mower-model preset must not write
          these: the preset describes the machine, not its electronics.
        type: object
      robot_name:
        description: |-
          RobotName is robot_name from the installed config (or its default):
          the header badge shows it beside the backend.
        type: string
      supported:
        items:
          type: string
        type: array
    type: object
  api.ImportDockPose:
    properties:
      x:
        type: number
      "y":
        type: number
      yaw_rad:
        type: number
    type: object
  api.ImportOpenMowerRequest:
    properties:
      apply:
        type: boolean
      map:
        items:
          type: integer
        type: array
      om_datum_lat:
        type: number
      om_datum_lon:
        type: number
    type: object
  api.ImportOpenMowerSummary:
    properties:
      applied:
        type: boolean
      areas:
        items:
          $ref: '#/definitions/api.ImportedAreaBrief'
        type: array
      datum_shift_east_m:
        type: number
      datum_shift_north_m:
        type: number
      dock_pose:
        $ref: '#/definitions/api.ImportDockPose'
      mn_datum_configured:
        description: |-
          MnDatumConfigured is true when mowgli_robot.yaml already has a
          datum_lat/datum_lon set. The GUI uses this to decide whether to
          offer the "import the datum too" step: on a fresh install (false)
          the OpenMower datum can be adopted as the robot's datum; when a
          datum already exists (true) the geometry was reprojected INTO it,
          so overwriting it would misalign the just-imported map — the GUI
          then hides the datum-import option.
        type: boolean
      mowing_areas:
        type: integer
      navigation_areas:
        type: integer
      obstacles:
        type: integer
      orphan_obstacles:
        type: integer
      warnings:
        items:
          type: string
        type: array
    type: object
  api.ImportedAreaBrief:
    properties:
      approx_area_sqm:
        type: number
      is_navigation_area:
        type: boolean
      name:
        type: string
      obstacles:
        type: integer
      type:
        description: '"mow" | "nav"'
        type: string
      vertices:
        type: integer
    type: object
