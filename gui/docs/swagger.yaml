    type: object
  api.RemoteAccessSettingsResponse:
    properties:
      authKeyMasked:
        type: string
      authKeySet:
        type: boolean
      containerName:
        type: string
      defaultImage:
        type: string
      enabled:
        type: boolean
      hostname:
        type: string
      image:
        type: string
      serveHttps:
        type: boolean
    type: object
  api.RemoteAccessSettingsUpdate:
    properties:
      authKey:
        type: string
      clearAuthKey:
        type: boolean
      enabled:
        type: boolean
      hostname:
        type: string
      image:
        type: string
      serveHttps:
        type: boolean
    type: object
  api.Schedule:
    properties:
      areaId:
        description: |-
          AreaID is the STABLE map area id (MapArea.id) this schedule mows; 0 means
          every area (a plain Start). The scheduler resolves it to the current
          positional index when the schedule fires. AreaName is a display snapshot
          so the GUI and MQTT consumers can label it, even if the area was removed.
        type: integer
      areaName:
        type: string
      createdAt:
        type: string
      daysOfWeek:
        description: 0=Sunday .. 6=Saturday
        items:
          type: integer
        type: array
      enabled:
        type: boolean
      id:
        type: string
      lastRun:
        type: string
      lastSkipReason:
        description: |-
          Written by the scheduler when a due run was skipped (soil wet); the GUI
          shows them, the API only preserves them across updates.
        type: string
      lastSkippedAt:
        type: string
      time:
        description: HH:mm format
        type: string
    type: object
  api.ScheduleListResponse:
    properties:
      schedules:
        items:
          $ref: '#/definitions/api.Schedule'
        type: array
